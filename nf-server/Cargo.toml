[package]
name = "nf-server"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[features]
default = ["zakura"]
upstream = [
    "dep:zcash_primitives",
    "dep:zcash_protocol",
    "voting-crypto-deps/lrz-vct",
    "pir-server?/upstream",
    "pir-export/upstream",
    "pir-types/upstream",
    "nf-ingest/upstream",
    "imt-tree/upstream",
]
zakura = [
    "dep:zakura-primitives",
    "dep:zakura-protocol",
    "voting-crypto-deps/vct",
    "pir-server?/zakura",
    "pir-export/zakura",
    "pir-types/zakura",
    "nf-ingest/zakura",
    "imt-tree/zakura",
]
serve = ["dep:pir-server", "dep:axum", "dep:tower-http", "dep:sentry", "dep:prometheus"]
avx512 = ["serve", "pir-server/avx512"]
# Parallelise the YPIR dot-product kernel across cores via rayon.
# Orthogonal to avx512: both are additive and typically enabled together
# on the release fleet (see .github/workflows/release.yml).
rayon = ["serve", "pir-server/rayon"]

[dependencies]
# Serve-only (YPIR PIR server)
pir-server         = { path = "../pir/server", optional = true, default-features = false }
axum               = { version = "0.7", optional = true }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tower-http         = { version = "0.5", features = ["cors"], optional = true }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sentry             = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"], optional = true }
# Snapshot bootstrap: hashing tier files against the published manifest.
sha2               = "0.10"
base64             = "0.22"
ed25519-dalek      = "2"
# /metrics endpoint and counters/gauges for the bootstrap pipeline.
prometheus         = { version = "0.13", default-features = false, features = ["process"], optional = true }

# Always needed
# Select the block parser matching the tree's crypto backend. Both crates expose the
# same API as `zcash_primitives` / `zcash_protocol`; neither backend may pull the
# other's crypto dependency graph.
zakura-primitives = { version = "2.0", default-features = false, features = ["std"], optional = true }
zakura-protocol = { version = "2.0", default-features = false, optional = true }
# The librustzcash NU7 pre-release; the exact pin is intended until it is published.
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false, features = ["std"], optional = true }
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false, optional = true }
pir-export        = { path = "../pir/export", default-features = false }
pir-types         = { path = "../pir/types", default-features = false }
nf-ingest = { path = "../nf-ingest", default-features = false }
imt-tree          = { workspace = true }
voting-crypto-deps = { workspace = true }
tokio             = { version = "1", features = ["rt-multi-thread", "macros"] }
clap              = { version = "4", features = ["derive", "env"] }
anyhow            = "1.0"
hex               = "0.4"
rayon             = "1"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
hex = "0.4"
sha2 = "0.10"
sentry = { version = "0.35", default-features = false, features = ["test"] }
