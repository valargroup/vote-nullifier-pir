[workspace]
resolver = "2"
members = [
    "imt-tree",
    "nf-server",
    "pir/client",
    "pir/export",
    "pir/server",
    "pir/test",
    "pir/types",
    "nf-ingest",
    "deploy/pir-probe",
]

[workspace.package]
rust-version = "1.97"

[workspace.dependencies]
imt-tree = { path = "imt-tree", version = "=0.6.0", default-features = false }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits.git", rev = "6ef6bfa41cd828333d5e89f05f0092cc782f1b3d", version = "=0.3.0", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1

# Keep every Common package on the same unpublished voting API revision.
[patch.crates-io]
zakura-bellman = { git = "https://github.com/zakura-core/common.git", rev = "f0a08f864d4f88c8ef4a3c2fc6636e8d5ee4df8c" }
