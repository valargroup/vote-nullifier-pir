[workspace]
resolver = "2"
members = [
    "imt-tree",
    "nf-server",
    "pir/client",
    "pir/export",
    "pir/server",
    "pir/test",
    "pir/types",
    "nf-ingest",
    "deploy/pir-probe",
]

[workspace.package]
rust-version = "1.97"

[workspace.dependencies]
imt-tree = { path = "imt-tree", version = "=0.7.0", default-features = false }
voting-crypto-deps = { version = "=0.4.0", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
