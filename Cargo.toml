[workspace]
resolver = "2"
members = [
    "nf-server",
    "pir/client",
    "pir/export",
    "pir/server",
    "pir/test",
    "pir/types",
    "nf-ingest",
    "deploy/pir-probe",
]

[workspace.package]
rust-version = "1.91"

[workspace.dependencies]
imt-tree = { version = "0.5.4", default-features = false }
voting-crypto-deps = { version = "0.2.4", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
