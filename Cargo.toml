[workspace]
resolver = "2"
members = [
    "nf-server",
    "pir/client",
    "pir/export",
    "pir/server",
    "pir/test",
    "pir/types",
    "nf-ingest",
    "deploy/pir-probe",
]

[workspace.package]
rust-version = "1.91"

[workspace.dependencies]
imt-tree = { version = "0.5.4", default-features = false }
voting-crypto-deps = { version = "0.2.4", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1

# The LRZ backend needs the unreleased voting-crypto-deps and imt-tree that move
# to orchard 0.16 and the librustzcash NU7 pre-releases, and the Zakura backend
# needs the Zakura 2.0 crates ported to the stable bip32 0.6 / secp256k1 0.33
# stack. Both voting-crypto-deps and imt-tree live in the voting-circuits
# repository; their entries name the same commit so the two crates stay in
# step. Remove this section once the voting-crypto-deps, imt-tree, and
# zakura-core/common (#538) releases are published.
[patch.crates-io]
imt-tree = { git = "https://github.com/zodl-inc/voting-circuits", rev = "1e33d48e436482e0f364ff0f9f886904f88fa515" }
voting-crypto-deps = { git = "https://github.com/zodl-inc/voting-circuits", rev = "1e33d48e436482e0f364ff0f9f886904f88fa515" }
zakura-halo2-gadgets = { git = "https://github.com/zodl-inc/zakura-common", rev = "c714f350a629d5419a1c341c192812ce58cb4013" }
zakura-halo2-poseidon = { git = "https://github.com/zodl-inc/zakura-common", rev = "c714f350a629d5419a1c341c192812ce58cb4013" }
zakura-halo2-proofs = { git = "https://github.com/zodl-inc/zakura-common", rev = "c714f350a629d5419a1c341c192812ce58cb4013" }
zakura-pasta-curves = { git = "https://github.com/zodl-inc/zakura-common", rev = "c714f350a629d5419a1c341c192812ce58cb4013" }
zakura-sinsemilla = { git = "https://github.com/zodl-inc/zakura-common", rev = "c714f350a629d5419a1c341c192812ce58cb4013" }
