[workspace]
resolver = "2"
members = [
    "imt-tree",
    "nf-server",
    "pir/client",
    "pir/export",
    "pir/server",
    "pir/test",
    "pir/types",
    "nf-ingest",
]

[workspace.dependencies]
imt-tree = { path = "imt-tree", version = "0.2.1", default-features = false }
voting-crypto-deps = { version = "0.1.0", git = "https://github.com/valargroup/voting-circuits", rev = "e2b8c10b76e59e7155d2b3842203af74d9891a2f", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
