[package]
name = "pir-apm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.5.61", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.151"
sysinfo = "0.36.1"
tokio = { version = "1.53.1", features = ["full"] }
