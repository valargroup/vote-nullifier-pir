[package]
name = "nf-ingest"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[features]
default = ["zakura"]
upstream = ["voting-crypto-deps/lrz-vct", "imt-tree/upstream", "pir-types/upstream"]
zakura = ["voting-crypto-deps/vct", "imt-tree/zakura", "pir-types/zakura"]

[dependencies]
imt-tree = { workspace = true }
pir-types = { path = "../pir/types", default-features = false }
voting-crypto-deps = { workspace = true }
anyhow = "1.0"
hex = "0.4"
rayon = "1"
prost = "0.10.3"
tonic = { version = "0.7.2", features = ["tls", "tls-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
