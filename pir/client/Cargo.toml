[package]
name = "pir-client"
version = "0.4.0-rc.2"
edition = "2021"
description = "Private Information Retrieval client for Zcash nullifier non-membership proofs. Fetches circuit-ready Merkle authentication paths without revealing the queried nullifier to the server."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/vote-nullifier-pir"
readme = "README.md"

[dev-dependencies]
rand = "0.8"
pir-export = { path = "../export" }

[dependencies]
pir-types  = { path = "../types", version = "=0.3.0-rc.2", features = ["reader"] }
imt-tree = { workspace = true }
ypir = { version = "0.1.4", package = "valar-ypir", default-features = false }
hex = "0.4"
anyhow = "1.0"
ff = "0.13"
pasta_curves = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
futures = "0.3"
log = "0.4"
