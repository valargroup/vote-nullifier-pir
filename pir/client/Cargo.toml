[package]
name = "pir-client"
version = "0.7.0"
edition = "2021"
description = "Private Information Retrieval client for Zcash nullifier non-membership proofs. Fetches circuit-ready Merkle authentication paths without revealing the queried nullifier to the server."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/vote-nullifier-pir"
readme = "README.md"

[features]
default = ["zakura"]
upstream = [
    "voting-crypto-deps/lrz-vct",
    "pir-types/upstream",
    "imt-tree/upstream",
    "pir-export/upstream",
]
zakura = [
    "voting-crypto-deps/vct",
    "pir-types/zakura",
    "imt-tree/zakura",
    "pir-export/zakura",
]

[dev-dependencies]
rand = "0.8"
pir-export = { path = "../export", default-features = false }

[dependencies]
pir-types  = { path = "../types", version = "=0.6.0", default-features = false, features = ["reader"] }
imt-tree = { workspace = true }
voting-crypto-deps = { workspace = true }
ypir = { version = "0.2.0", package = "valar-ypir", default-features = false }
hex = "0.4"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
futures = "0.3"
log = "0.4"
