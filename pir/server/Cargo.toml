[package]
name = "pir-server"
version = "0.1.0"
edition = "2021"

[features]
default = ["zakura"]
upstream = ["voting-crypto-deps/lrz-vct", "pir-types/upstream"]
zakura = ["voting-crypto-deps/vct", "pir-types/zakura"]
avx512 = ["ypir/explicit_avx512"]
rayon = ["ypir/rayon"]

[dependencies]
pir-types  = { path = "../types", default-features = false, features = ["reader"] }
voting-crypto-deps = { workspace = true }
ypir = { version = "0.2.0", package = "valar-ypir", default-features = false, features = ["server"] }
spiral-rs = { version = "0.5", package = "valar-spiral-rs" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
blake3 = "1"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"
