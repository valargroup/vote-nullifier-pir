[package]
name = "pir-test"
version = "0.1.0"
edition = "2021"

[features]
default = ["zakura"]
upstream = [
    "voting-crypto-deps/lrz-vct",
    "pir-export/upstream",
    "pir-client/upstream",
    "pir-server/upstream",
    "pir-types/upstream",
    "nf-ingest/upstream",
]
zakura = [
    "voting-crypto-deps/vct",
    "pir-export/zakura",
    "pir-client/zakura",
    "pir-server/zakura",
    "pir-types/zakura",
    "nf-ingest/zakura",
]

[dependencies]
pir-export = { path = "../export", default-features = false }
pir-client = { path = "../client", default-features = false }
pir-server = { path = "../server", default-features = false }
pir-types  = { path = "../types", default-features = false }
nf-ingest = { path = "../../nf-ingest", default-features = false }
voting-crypto-deps = { workspace = true }
ypir = { version = "0.2.0", package = "valar-ypir", default-features = false, features = ["server"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hdrhistogram = "7"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
env_logger = "0.11"
