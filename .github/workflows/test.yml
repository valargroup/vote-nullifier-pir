name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Rust formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path deploy/pir-apm/Cargo.toml -- --check

      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path deploy/pir-apm/Cargo.toml --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-

      - name: nf-server doctor (smoke)
        run: cargo run -p nf-server -- doctor

      - name: Test release channels
        run: scripts/test_release_channel.sh

      - name: Run unit tests
        run: |
          cargo test --lib -p imt-tree
          cargo test --lib -p nf-ingest
          cargo test -p pir-types -p pir-export -p pir-client
          # nf-server is a binary crate; run its unit tests + the
          # bootstrap_e2e integration suite under the `serve` feature
          # (the only build configuration in which the bootstrap and
          # /metrics modules are compiled in).
          cargo test -p nf-server --features serve
          cargo test --locked --manifest-path deploy/pir-apm/Cargo.toml
          cargo run --quiet -p nf-server --features serve -- serve --help \
            | grep -Fq -- '--zcash-network'

  upstream:
    name: Upstream backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-upstream-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-upstream-

      - name: Test upstream backend
        run: |
          cargo test --workspace --all-targets --no-default-features \
            --features imt-tree/upstream,pir-types/upstream,pir-client/upstream,pir-export/upstream,pir-export/cli,pir-server/upstream,nf-ingest/upstream,nf-server/upstream,nf-server/serve,pir-test/upstream \
            --locked

      - name: Check backend contracts
        run: |
          if cargo tree --workspace --locked \
            | grep -Eq '(^|[[:space:]├└│])(pasta_curves|halo2_gadgets|halo2_poseidon|halo2_proofs|orchard|sinsemilla) v'; then
            echo "Upstream crypto crates entered the default Zakura graph"
            exit 1
          fi

          if cargo tree --workspace --no-default-features \
            --features imt-tree/upstream,pir-types/upstream,pir-client/upstream,pir-export/upstream,pir-export/cli,pir-server/upstream,nf-ingest/upstream,nf-server/upstream,nf-server/serve,pir-test/upstream \
            --locked \
            | grep -Eq 'zakura-(pasta-curves|halo2-gadgets|halo2-poseidon|halo2-proofs|orchard|sinsemilla)'; then
            echo "Zakura crypto crates entered the upstream graph"
            exit 1
          fi

          if cargo check -p imt-tree --no-default-features --locked; then
            echo "A crypto backend must be selected"
            exit 1
          fi

          if cargo check -p imt-tree --all-features --locked; then
            echo "The upstream and Zakura backends must remain mutually exclusive"
            exit 1
          fi

  notify-slack:
    name: Slack Notification
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && (needs.test.result == 'failure' || needs.upstream.result == 'failure') }}
    needs: [test, upstream]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PIR Tests failed on main",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "PIR Tests Failed on main" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Tests>" },
                    { "type": "mrkdwn", "text": "*Branch:*\nmain" },
                    { "type": "mrkdwn", "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>" },
                    { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                  ]
                }
              ]
            }
