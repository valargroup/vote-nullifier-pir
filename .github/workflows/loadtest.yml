# Manual load test against a running PIR server.
# PIR endpoint URLs are resolved from the published static/dynamic voting config.

name: Load test PIR

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment to read load-test vars from"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      target:
        description: "Which server to target"
        type: choice
        options:
          - backup
          - primary
        default: backup
      concurrency:
        description: "Number of concurrent workers"
        type: string
        default: "8"
      rps:
        description: "Target requests/sec (open-loop). Leave empty for closed-loop."
        type: string
        default: ""
      duration:
        description: "Load phase duration (e.g. 60s, 5m)"
        type: string
        default: "60s"
      snapshot_height:
        description: "Published snapshot height to load nullifiers from"
        type: string
        required: true

permissions:
  contents: read

jobs:
  loadtest:
    name: Load test (${{ inputs.target }}, c=${{ inputs.concurrency }}, ${{ inputs.duration }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      VOTING_CONFIG_URL: ${{ vars.VOTING_CONFIG_URL }}
      SNAPSHOTS_BASE: ${{ vars.SNAPSHOTS_BASE_URL }}
      SVOTE_ZCASH_NETWORK: ${{ inputs.target_environment == 'staging' && 'test' || 'main' }}
      SNAPSHOT_HEIGHT: ${{ inputs.snapshot_height }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"

      - name: Build pir-test
        run: cargo build --release -p pir-test

      - name: Resolve PIR endpoint from voting-config
        run: |
          if [ -z "$VOTING_CONFIG_URL" ]; then
            echo "VOTING_CONFIG_URL environment variable is required." >&2
            exit 1
          fi
          curl -fsSL --retry 3 "$VOTING_CONFIG_URL" -o voting-config.json
          DYNAMIC_CONFIG_URL="$(jq -r '.dynamic_config_url // empty' voting-config.json)"
          if [ -n "$DYNAMIC_CONFIG_URL" ]; then
            curl -fsSL --retry 3 "$DYNAMIC_CONFIG_URL" -o voting-config.json
          fi
          if [ "${{ inputs.target }}" = "primary" ]; then
            PIR_URL=$(jq -r '.pir_endpoints[0].url' voting-config.json)
          else
            PIR_URL=$(jq -r '.pir_endpoints[1].url' voting-config.json)
          fi
          curl -fsSL --retry 3 "${PIR_URL%/}/root" -o pir-root.json
          if ! jq -e --arg network "$SVOTE_ZCASH_NETWORK" --arg height "$SNAPSHOT_HEIGHT" \
            '.zcash_network == $network and (.height | tostring) == $height and .nullifier_pool == "ironwood" and .dataset_version == 2' \
            pir-root.json >/dev/null; then
            echo "PIR endpoint is not serving the expected $SVOTE_ZCASH_NETWORK dataset" >&2
            exit 1
          fi
          echo "PIR_URL=$PIR_URL" >> "$GITHUB_ENV"
          echo "Target: $PIR_URL"

      - name: Fetch nullifiers snapshot
        run: |
          set -euo pipefail
          if [ -z "$SNAPSHOTS_BASE" ]; then
            echo "SNAPSHOTS_BASE_URL environment variable is required." >&2
            exit 1
          fi
          HEIGHT="$SNAPSHOT_HEIGHT"
          case "$HEIGHT" in
            '' | *[!0-9]*)
              echo "snapshot_height input must be a non-negative integer, got: ${HEIGHT:-<empty>}" >&2
              exit 1
              ;;
          esac
          SNAPSHOT_BASE="$SNAPSHOTS_BASE/$SVOTE_ZCASH_NETWORK/$HEIGHT"
          curl -fsSL --retry 3 "$SNAPSHOT_BASE/manifest.json" -o manifest.json
          if ! jq -e \
            '.schema_version == 2 and .nullifier_pool == "ironwood" and .dataset_version == 2' \
            manifest.json >/dev/null; then
            echo "ERROR: snapshot manifest is not Ironwood dataset version 1 with schema version 2"
            exit 1
          fi

          for f in nullifiers.dataset.json nullifiers.bin; do
            if ! jq -e --arg f "$f" \
              '(.files[$f].sha256 | type == "string") and (.files[$f].size | type == "number")' \
              manifest.json >/dev/null; then
              echo "ERROR: snapshot $HEIGHT has no valid $f entry in manifest."
              echo "Publish that height with include_nullifier_artifacts enabled."
              exit 1
            fi
          done

          download_and_verify() {
            local f="$1"
            local expected_sha expected_size actual_sha actual_size
            expected_sha=$(jq -r --arg f "$f" '.files[$f].sha256' manifest.json)
            expected_size=$(jq -r --arg f "$f" '.files[$f].size' manifest.json)
            echo "Fetching $SNAPSHOT_BASE/$f"
            curl -fL --retry 3 -o "$f" "$SNAPSHOT_BASE/$f"
            actual_size=$(wc -c < "$f" | tr -d ' ')
            if [ "$actual_size" != "$expected_size" ]; then
              echo "ERROR: $f size mismatch (expected $expected_size, got $actual_size)"
              exit 1
            fi
            actual_sha=$(sha256sum "$f" | awk '{print $1}')
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "ERROR: $f sha256 mismatch"
              exit 1
            fi
          }

          download_and_verify nullifiers.dataset.json
          if ! jq -e \
            --arg network "$SVOTE_ZCASH_NETWORK" \
            '.zcash_network == $network and .nullifier_pool == "ironwood" and .dataset_version == 2' \
            nullifiers.dataset.json >/dev/null; then
            echo "ERROR: nullifiers.dataset.json has the wrong dataset identity"
            exit 1
          fi
          download_and_verify nullifiers.bin
          echo "Fetched $SVOTE_ZCASH_NETWORK Ironwood nullifiers for height $HEIGHT"

      - name: Run load test
        run: |
          ARGS=(--url "$PIR_URL" --nullifiers nullifiers.bin --concurrency "${{ inputs.concurrency }}" --duration "${{ inputs.duration }}" --json-out summary.json)
          if [ -n "${{ inputs.rps }}" ]; then
            ARGS+=(--rps "${{ inputs.rps }}")
          fi
          ./target/release/pir-test load "${ARGS[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-summary
          path: summary.json
