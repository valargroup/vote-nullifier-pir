# Rolling restart of the PIR fleet.
#
# nf-server self-bootstraps from the environment pir.json and
# precomputed-snapshot bucket on startup. So the entire flow for
# "make replicas pick up a new snapshot_height" is publishing pir.json
# and restarting the fleet.
# This workflow exists so that step doesn't require ssh access from
# every operator's laptop.
#
# Ordering: when targets=both, backup-beta, backup, primary-beta, then primary.
# Each successor starts only after the previous host is healthy and converged.
# (pir.<domain> is the convenience alias for primary, so primary
# carries traffic while backup is restarting; once primary restarts,
# backup is already serving the new snapshot).
#
# Requires environment secrets: PIR_PRIMARY_HOST, PIR_BACKUP_HOST,
# PIR_PRIMARY_BETA_HOST, PIR_BACKUP_BETA_HOST, DEPLOY_USER, SSH_KEY.

name: Restart PIR fleet

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment to read fleet secrets and vars from"
        required: true
        type: choice
        options:
          - staging
          - production
        default: production
      targets:
        description: "Which hosts to restart (rolling, backup-then-primary when both)"
        required: true
        type: choice
        options:
          - both
          - primary
          - backup
          - primary-beta
          - backup-beta
        default: both
      verify_height_converged:
        description: "After restart, fail the job if served_height < expected_height"
        required: false
        type: boolean
        default: true
      height:
        description: "Optional published DO snapshot height to force for this restart"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      target_environment:
        required: false
        type: string
        default: production
      targets:
        required: false
        type: string
        default: both
      verify_height_converged:
        required: false
        type: boolean
        default: true
      height:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  SVOTE_ZCASH_NETWORK: ${{ inputs.target_environment == 'staging' && 'test' || 'main' }}

jobs:
  validate_height:
    name: Validate restart inputs
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    outputs:
      forced_height: ${{ steps.validate.outputs.forced_height }}
    env:
      SNAPSHOTS_BASE_URL: ${{ vars.SNAPSHOTS_BASE_URL }}
    steps:
      - name: Validate inputs
        id: validate
        env:
          REQUESTED_HEIGHT: ${{ inputs.height }}
          LWD_URLS: ${{ vars.LWD_URLS }}
          TARGETS: ${{ inputs.targets }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" != production ] && [[ "$TARGETS" == *-beta ]]; then
            echo "Beta PIR targets exist only in production." >&2
            exit 1
          fi
          if [ -z "${LWD_URLS//[[:space:],]/}" ]; then
            echo "LWD_URLS must name at least one lightwalletd endpoint." >&2
            exit 1
          fi
          HEIGHT="$REQUESTED_HEIGHT"
          HEIGHT="$(printf '%s' "$HEIGHT" | tr -d '[:space:]')"

          if [ -z "$HEIGHT" ]; then
            echo "forced_height=" >> "$GITHUB_OUTPUT"
            echo "No forced snapshot height requested."
            exit 0
          fi
          if [ -z "$SNAPSHOTS_BASE_URL" ]; then
            echo "SNAPSHOTS_BASE_URL environment variable is required for forced-height validation." >&2
            exit 1
          fi

          case "$HEIGHT" in
            *[!0-9]*)
              echo "height must be numeric, got: $HEIGHT" >&2
              exit 1
              ;;
          esac
          if [ $((HEIGHT % 10)) -ne 0 ]; then
            echo "height must be a multiple of 10, got: $HEIGHT" >&2
            exit 1
          fi

          MANIFEST_URL="$SNAPSHOTS_BASE_URL/$SVOTE_ZCASH_NETWORK/$HEIGHT/manifest.json"
          echo "==> Fetching $MANIFEST_URL"
          curl -fsSL --retry 3 "$MANIFEST_URL" -o manifest.json

          if ! jq -e \
            '.schema_version == 2 and .nullifier_pool == "ironwood" and .dataset_version == 2' \
            manifest.json >/dev/null; then
            echo "manifest has the wrong schema or dataset identity" >&2
            exit 1
          fi

          MANIFEST_HEIGHT="$(jq -r '.height // empty' manifest.json)"
          if [ "$MANIFEST_HEIGHT" != "$HEIGHT" ]; then
            echo "manifest height ($MANIFEST_HEIGHT) does not match requested height ($HEIGHT)" >&2
            exit 1
          fi

          for f in tier0.bin tier1.bin pir_root.json; do
            if ! jq -e --arg f "$f" '.files[$f].sha256 and .files[$f].size' manifest.json >/dev/null; then
              echo "manifest is missing required file entry: $f" >&2
              exit 1
            fi
            curl -fsSI --retry 3 "$SNAPSHOTS_BASE_URL/$SVOTE_ZCASH_NETWORK/$HEIGHT/$f" >/dev/null
          done

          curl -fsSL --retry 3 "$SNAPSHOTS_BASE_URL/$SVOTE_ZCASH_NETWORK/$HEIGHT/pir_root.json" -o pir_root.json
          if ! jq -e --arg network "$SVOTE_ZCASH_NETWORK" '.zcash_network == $network' pir_root.json >/dev/null; then
            echo "pir_root.json is not for Zcash network $SVOTE_ZCASH_NETWORK" >&2
            exit 1
          fi

          echo "forced_height=$HEIGHT" >> "$GITHUB_OUTPUT"
          echo "$SVOTE_ZCASH_NETWORK snapshot $HEIGHT is published and has all required tier files."

  restart_backup_beta:
    name: Restart backup-beta
    needs: validate_height
    if: inputs.target_environment == 'production' && (inputs.targets == 'both' || inputs.targets == 'backup-beta')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/restart-pir-host
        with:
          host: ${{ secrets.PIR_BACKUP_BETA_HOST }}
          host_role: backup-beta
          deploy_user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          target_environment: ${{ inputs.target_environment }}
          verify_height: ${{ inputs.verify_height_converged }}
          forced_height: ${{ needs.validate_height.outputs.forced_height }}
          precomputed_base_url: ${{ vars.PRECOMPUTED_BASE_URL }}
          pir_config_url: ${{ vars.PIR_CONFIG_URL }}
          voting_config_url: ${{ vars.VOTING_CONFIG_URL }}
          lwd_urls: ${{ vars.LWD_URLS }}

  restart_backup:
    name: Restart backup
    needs: [validate_height, restart_backup_beta]
    if: |
      always() &&
      (inputs.targets == 'both' || inputs.targets == 'backup') &&
      needs.validate_height.result == 'success' &&
      (needs.restart_backup_beta.result == 'success' || needs.restart_backup_beta.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Restart and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PIR_BACKUP_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: VERIFY_HEIGHT,FORCED_HEIGHT,PRECOMPUTED_BASE_URL,TARGET_ENVIRONMENT,PIR_CONFIG_URL,VOTING_CONFIG_URL,SVOTE_ZCASH_NETWORK,LWD_URLS
          # Cold-start budget: snapshot self-bootstrap (~30s for the
          # ~6 GB CDN download in-region) + load_serving_state (mmaps
          # and parses ~6 GB of tier files into memory, 60-90s on the
          # production droplets). 11 minutes leaves headroom for a
          # slow link without waiting forever on a real failure.
          command_timeout: 11m
          script: |
            set -eu

            if ! sudo /opt/nf-ingest/nf-server serve --help 2>&1 | grep -Fq -- '--zcash-network'; then
              echo "FAIL: installed nf-server lacks --zcash-network; deploy the new release before restarting."
              exit 1
            fi

            DATASET_INFO=$(sudo /opt/nf-ingest/nf-server dataset-info)
            if ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*2[[:space:]]*([,}])'; then
              echo "FAIL: installed nf-server does not support Ironwood dataset version 1."
              exit 1
            fi

            DROPIN_DIR=/etc/systemd/system/nullifier-query-server.service.d
            DROPIN_FILE="$DROPIN_DIR/force-snapshot.conf"
            DEFAULTS_FILE=/etc/default/nf-server

            case "$TARGET_ENVIRONMENT" in
              production) PIR_ENV=prod ;;
              staging) PIR_ENV=stage ;;
              *)
                echo "Unsupported target_environment: $TARGET_ENVIRONMENT" >&2
                exit 1
                ;;
            esac
            PIR_DATA_DIR="/opt/nf-ingest/pir-data/$SVOTE_ZCASH_NETWORK"
            PIR_CONFIG_URL="${PIR_CONFIG_URL:-https://voting.valargroup.dev/${PIR_ENV}/pir.json}"
            VOTING_CONFIG_URL="${VOTING_CONFIG_URL:-https://voting.valargroup.dev/${PIR_ENV}/static-voting-config.json}"
            PRECOMPUTED_BASE_URL="${PRECOMPUTED_BASE_URL:-https://shielded-vote.nyc3.digitaloceanspaces.com}"
            echo "==> Writing PIR defaults ($PIR_ENV)"
            tmp=$(mktemp)
            if sudo test -f "$DEFAULTS_FILE"; then
              sudo awk '!/^(SVOTE_ZCASH_NETWORK|SVOTE_PIR_DATA_DIR|SVOTE_PIR_CONFIG_URL|SVOTE_PIR_VOTING_CONFIG_URL|SVOTE_PIR_PRECOMPUTED_BASE_URL|LWD_URLS)=/' "$DEFAULTS_FILE" > "$tmp"
            fi
            {
              echo "SVOTE_ZCASH_NETWORK=$SVOTE_ZCASH_NETWORK"
              echo "LWD_URLS=$LWD_URLS"
              echo "SVOTE_PIR_DATA_DIR=$PIR_DATA_DIR"
              echo "SVOTE_PIR_CONFIG_URL=$PIR_CONFIG_URL"
              echo "SVOTE_PIR_VOTING_CONFIG_URL=$VOTING_CONFIG_URL"
              echo "SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL"
            } >> "$tmp"
            sudo install -m 0644 -o root -g root "$tmp" "$DEFAULTS_FILE"
            rm -f "$tmp"
            sudo install -d -m 0755 "$PIR_DATA_DIR"

            if [ -n "$FORCED_HEIGHT" ]; then
              if [ -z "$PRECOMPUTED_BASE_URL" ]; then
                echo "PRECOMPUTED_BASE_URL is required when forcing a snapshot height." >&2
                exit 1
              fi
              echo "==> Forcing snapshot bootstrap height $FORCED_HEIGHT from $PRECOMPUTED_BASE_URL"
              sudo install -d -m 0755 "$DROPIN_DIR"
              tmp=$(mktemp)
              cat > "$tmp" <<EOF
            [Service]
            Environment=SVOTE_PIR_FORCE_SNAPSHOT_HEIGHT=$FORCED_HEIGHT
            Environment=SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL
            EOF
              sudo install -m 0644 -o root -g root "$tmp" "$DROPIN_FILE"
              rm -f "$tmp"
              sudo systemctl daemon-reload
            elif sudo test -f "$DROPIN_FILE"; then
              echo "==> Removing stale forced snapshot drop-in"
              sudo rm -f "$DROPIN_FILE"
              sudo systemctl daemon-reload
            fi

            echo "==> Restarting nullifier-query-server on backup"
            sudo systemctl restart nullifier-query-server

            # Gate on /ready, not /health. /health returns 200 as soon
            # as the listener binds (liveness); /ready returns 200 only
            # once tier files are mmapped and queries can be served.
            # Polling /health here would let primary restart while
            # backup is still loading, violating the "never lose both
            # replicas" invariant of this workflow.
            echo "==> Waiting for /ready to return 200"
            for i in $(seq 1 120); do
              if curl -sf --max-time 4 http://localhost:3000/ready > /dev/null; then
                echo "Readiness check passed (attempt $i)"
                break
              fi
              echo "Waiting for readiness... attempt $i/120"
              sleep 5
            done

            if ! curl -sf --max-time 4 http://localhost:3000/ready > /dev/null; then
              echo "Readiness check FAILED after 10m"
              sudo systemctl status nullifier-query-server --no-pager -l 2>/dev/null || true
              sudo journalctl -u nullifier-query-server --no-pager -n 80 2>/dev/null \
                || tail -120 /var/log/syslog 2>/dev/null | grep -i nf-server \
                || echo "No logs available"
              exit 1
            fi

            ROOT=$(curl -sf --max-time 4 http://localhost:3000/root)
            if ! printf '%s\n' "$ROOT" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$ROOT" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*2[[:space:]]*([,}])' || \
               ! printf '%s\n' "$ROOT" | grep -Eq "\"zcash_network\"[[:space:]]*:[[:space:]]*\"$SVOTE_ZCASH_NETWORK\""; then
              echo "FAIL: backup is not serving $SVOTE_ZCASH_NETWORK Ironwood dataset version 1."
              exit 1
            fi

            METRICS=$(curl -sf --max-time 4 http://localhost:3000/metrics)
            metric_value() {
              printf '%s\n' "$METRICS" | awk -v name="$1" '$1==name {print int($2); found=1; exit} END {if (!found) exit 1}'
            }
            if ! SERVED=$(metric_value nf_snapshot_served_height); then
              echo "FAIL: nf_snapshot_served_height metric is missing."
              exit 1
            fi
            if ! EXPECTED=$(metric_value nf_snapshot_expected_height); then
              echo "FAIL: nf_snapshot_expected_height metric is missing."
              exit 1
            fi

            echo "==> Snapshot heights: served=$SERVED expected=$EXPECTED"
            echo "==> Bootstrap outcomes:"
            printf '%s\n' "$METRICS" | awk '$1 ~ /^nf_snapshot_bootstrap_outcomes_total/ {print "  " $0}' || true

            if [ -n "$FORCED_HEIGHT" ]; then
              if [ "$SERVED" -ne "$FORCED_HEIGHT" ]; then
                echo "FAIL: served ($SERVED) != forced height ($FORCED_HEIGHT)."
                echo "Hint: ensure snapshots/${SVOTE_ZCASH_NETWORK}/${FORCED_HEIGHT}/ is published and inspect bootstrap outcomes above."
                exit 1
              fi
              echo "OK: backup is serving forced snapshot height $SERVED"
            elif [ "$VERIFY_HEIGHT" = "true" ]; then
              if [ "$EXPECTED" -gt 0 ] && [ "$SERVED" -lt "$EXPECTED" ]; then
                echo "FAIL: served ($SERVED) < expected ($EXPECTED). Replica didn't converge on the new snapshot."
                echo "Hint: ensure snapshots/${SVOTE_ZCASH_NETWORK}/${EXPECTED}/ is published, then re-run this workflow."
                exit 1
              elif [ "$EXPECTED" -eq 0 ] && [ "$SERVED" -le 0 ]; then
                echo "FAIL: expected height is zero and no served snapshot was reported."
                echo "Hint: this can mean no configured snapshot height plus no local snapshot, or a PIR/voting-config bootstrap failure. Check bootstrap outcomes and journalctl."
                exit 1
              elif [ "$EXPECTED" -eq 0 ]; then
                echo "OK: backup is ready and serving local snapshot height $SERVED (no configured expected height)."
              else
                echo "OK: backup converged on height $SERVED"
              fi
            else
              echo "Skipping height verification (verify_height_converged=false)"
            fi

            if [ -n "$FORCED_HEIGHT" ]; then
              echo "==> Removing forced snapshot drop-in after successful restart"
              sudo rm -f "$DROPIN_FILE"
              sudo systemctl daemon-reload
            fi
        env:
          VERIFY_HEIGHT: ${{ inputs.verify_height_converged }}
          FORCED_HEIGHT: ${{ needs.validate_height.outputs.forced_height }}
          PRECOMPUTED_BASE_URL: ${{ vars.PRECOMPUTED_BASE_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PIR_CONFIG_URL: ${{ vars.PIR_CONFIG_URL }}
          VOTING_CONFIG_URL: ${{ vars.VOTING_CONFIG_URL }}
          LWD_URLS: ${{ vars.LWD_URLS }}

  restart_primary_beta:
    name: Restart primary-beta
    needs: [validate_height, restart_backup]
    if: |
      always() &&
      inputs.target_environment == 'production' &&
      (inputs.targets == 'both' || inputs.targets == 'primary-beta') &&
      needs.validate_height.result == 'success' &&
      (needs.restart_backup.result == 'success' || needs.restart_backup.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/restart-pir-host
        with:
          host: ${{ secrets.PIR_PRIMARY_BETA_HOST }}
          host_role: primary-beta
          deploy_user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          target_environment: ${{ inputs.target_environment }}
          verify_height: ${{ inputs.verify_height_converged }}
          forced_height: ${{ needs.validate_height.outputs.forced_height }}
          precomputed_base_url: ${{ vars.PRECOMPUTED_BASE_URL }}
          pir_config_url: ${{ vars.PIR_CONFIG_URL }}
          voting_config_url: ${{ vars.VOTING_CONFIG_URL }}
          lwd_urls: ${{ vars.LWD_URLS }}

  restart_primary:
    name: Restart primary
    needs: [validate_height, restart_primary_beta]
    # Run when:
    #  - target includes primary, AND
    #  - backup either succeeded OR was skipped (target=primary only).
    # If backup ran and failed we DO NOT restart primary -- losing
    # both replicas at once is the only thing this workflow is
    # designed to prevent.
    if: |
      always() &&
      (inputs.targets == 'both' || inputs.targets == 'primary') &&
      needs.validate_height.result == 'success' &&
      (needs.restart_primary_beta.result == 'success' || needs.restart_primary_beta.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Restart and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PIR_PRIMARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: VERIFY_HEIGHT,FORCED_HEIGHT,PRECOMPUTED_BASE_URL,TARGET_ENVIRONMENT,PIR_CONFIG_URL,VOTING_CONFIG_URL,SVOTE_ZCASH_NETWORK,LWD_URLS
          command_timeout: 11m
          script: |
            set -eu

            if ! sudo /opt/nf-ingest/nf-server serve --help 2>&1 | grep -Fq -- '--zcash-network'; then
              echo "FAIL: installed nf-server lacks --zcash-network; deploy the new release before restarting."
              exit 1
            fi

            DATASET_INFO=$(sudo /opt/nf-ingest/nf-server dataset-info)
            if ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*2[[:space:]]*([,}])'; then
              echo "FAIL: installed nf-server does not support Ironwood dataset version 1."
              exit 1
            fi

            DROPIN_DIR=/etc/systemd/system/nullifier-query-server.service.d
            DROPIN_FILE="$DROPIN_DIR/force-snapshot.conf"
            DEFAULTS_FILE=/etc/default/nf-server

            case "$TARGET_ENVIRONMENT" in
              production) PIR_ENV=prod ;;
              staging) PIR_ENV=stage ;;
              *)
                echo "Unsupported target_environment: $TARGET_ENVIRONMENT" >&2
                exit 1
                ;;
            esac
            PIR_DATA_DIR="/opt/nf-ingest/pir-data/$SVOTE_ZCASH_NETWORK"
            PIR_CONFIG_URL="${PIR_CONFIG_URL:-https://voting.valargroup.dev/${PIR_ENV}/pir.json}"
            VOTING_CONFIG_URL="${VOTING_CONFIG_URL:-https://voting.valargroup.dev/${PIR_ENV}/static-voting-config.json}"
            PRECOMPUTED_BASE_URL="${PRECOMPUTED_BASE_URL:-https://shielded-vote.nyc3.digitaloceanspaces.com}"
            echo "==> Writing PIR defaults ($PIR_ENV)"
            tmp=$(mktemp)
            if sudo test -f "$DEFAULTS_FILE"; then
              sudo awk '!/^(SVOTE_ZCASH_NETWORK|SVOTE_PIR_DATA_DIR|SVOTE_PIR_CONFIG_URL|SVOTE_PIR_VOTING_CONFIG_URL|SVOTE_PIR_PRECOMPUTED_BASE_URL|LWD_URLS)=/' "$DEFAULTS_FILE" > "$tmp"
            fi
            {
              echo "SVOTE_ZCASH_NETWORK=$SVOTE_ZCASH_NETWORK"
              echo "LWD_URLS=$LWD_URLS"
              echo "SVOTE_PIR_DATA_DIR=$PIR_DATA_DIR"
              echo "SVOTE_PIR_CONFIG_URL=$PIR_CONFIG_URL"
              echo "SVOTE_PIR_VOTING_CONFIG_URL=$VOTING_CONFIG_URL"
              echo "SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL"
            } >> "$tmp"
            sudo install -m 0644 -o root -g root "$tmp" "$DEFAULTS_FILE"
            rm -f "$tmp"
            sudo install -d -m 0755 "$PIR_DATA_DIR"

            if [ -n "$FORCED_HEIGHT" ]; then
              if [ -z "$PRECOMPUTED_BASE_URL" ]; then
                echo "PRECOMPUTED_BASE_URL is required when forcing a snapshot height." >&2
                exit 1
              fi
              echo "==> Forcing snapshot bootstrap height $FORCED_HEIGHT from $PRECOMPUTED_BASE_URL"
              sudo install -d -m 0755 "$DROPIN_DIR"
              tmp=$(mktemp)
              cat > "$tmp" <<EOF
            [Service]
            Environment=SVOTE_PIR_FORCE_SNAPSHOT_HEIGHT=$FORCED_HEIGHT
            Environment=SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL
            EOF
              sudo install -m 0644 -o root -g root "$tmp" "$DROPIN_FILE"
              rm -f "$tmp"
              sudo systemctl daemon-reload
            elif sudo test -f "$DROPIN_FILE"; then
              echo "==> Removing stale forced snapshot drop-in"
              sudo rm -f "$DROPIN_FILE"
              sudo systemctl daemon-reload
            fi

            echo "==> Restarting nullifier-query-server on primary"
            sudo systemctl restart nullifier-query-server

            # Gate on /ready (not /health); see the backup step for
            # rationale.
            echo "==> Waiting for /ready to return 200"
            for i in $(seq 1 120); do
              if curl -sf --max-time 4 http://localhost:3000/ready > /dev/null; then
                echo "Readiness check passed (attempt $i)"
                break
              fi
              echo "Waiting for readiness... attempt $i/120"
              sleep 5
            done

            if ! curl -sf --max-time 4 http://localhost:3000/ready > /dev/null; then
              echo "Readiness check FAILED after 10m"
              sudo systemctl status nullifier-query-server --no-pager -l 2>/dev/null || true
              sudo journalctl -u nullifier-query-server --no-pager -n 80 2>/dev/null \
                || tail -120 /var/log/syslog 2>/dev/null | grep -i nf-server \
                || echo "No logs available"
              exit 1
            fi

            ROOT=$(curl -sf --max-time 4 http://localhost:3000/root)
            if ! printf '%s\n' "$ROOT" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$ROOT" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*2[[:space:]]*([,}])' || \
               ! printf '%s\n' "$ROOT" | grep -Eq "\"zcash_network\"[[:space:]]*:[[:space:]]*\"$SVOTE_ZCASH_NETWORK\""; then
              echo "FAIL: primary is not serving $SVOTE_ZCASH_NETWORK Ironwood dataset version 1."
              exit 1
            fi

            METRICS=$(curl -sf --max-time 4 http://localhost:3000/metrics)
            metric_value() {
              printf '%s\n' "$METRICS" | awk -v name="$1" '$1==name {print int($2); found=1; exit} END {if (!found) exit 1}'
            }
            if ! SERVED=$(metric_value nf_snapshot_served_height); then
              echo "FAIL: nf_snapshot_served_height metric is missing."
              exit 1
            fi
            if ! EXPECTED=$(metric_value nf_snapshot_expected_height); then
              echo "FAIL: nf_snapshot_expected_height metric is missing."
              exit 1
            fi

            echo "==> Snapshot heights: served=$SERVED expected=$EXPECTED"
            echo "==> Bootstrap outcomes:"
            printf '%s\n' "$METRICS" | awk '$1 ~ /^nf_snapshot_bootstrap_outcomes_total/ {print "  " $0}' || true

            if [ -n "$FORCED_HEIGHT" ]; then
              if [ "$SERVED" -ne "$FORCED_HEIGHT" ]; then
                echo "FAIL: served ($SERVED) != forced height ($FORCED_HEIGHT)."
                echo "Hint: ensure snapshots/${SVOTE_ZCASH_NETWORK}/${FORCED_HEIGHT}/ is published and inspect bootstrap outcomes above."
                exit 1
              fi
              echo "OK: primary is serving forced snapshot height $SERVED"
            elif [ "$VERIFY_HEIGHT" = "true" ]; then
              if [ "$EXPECTED" -gt 0 ] && [ "$SERVED" -lt "$EXPECTED" ]; then
                echo "FAIL: served ($SERVED) < expected ($EXPECTED). Replica didn't converge on the new snapshot."
                echo "Hint: ensure snapshots/${SVOTE_ZCASH_NETWORK}/${EXPECTED}/ is published, then re-run this workflow."
                exit 1
              elif [ "$EXPECTED" -eq 0 ] && [ "$SERVED" -le 0 ]; then
                echo "FAIL: expected height is zero and no served snapshot was reported."
                echo "Hint: this can mean no configured snapshot height plus no local snapshot, or a PIR/voting-config bootstrap failure. Check bootstrap outcomes and journalctl."
                exit 1
              elif [ "$EXPECTED" -eq 0 ]; then
                echo "OK: primary is ready and serving local snapshot height $SERVED (no configured expected height)."
              else
                echo "OK: primary converged on height $SERVED"
              fi
            else
              echo "Skipping height verification (verify_height_converged=false)"
            fi

            if [ -n "$FORCED_HEIGHT" ]; then
              echo "==> Removing forced snapshot drop-in after successful restart"
              sudo rm -f "$DROPIN_FILE"
              sudo systemctl daemon-reload
            fi
        env:
          VERIFY_HEIGHT: ${{ inputs.verify_height_converged }}
          FORCED_HEIGHT: ${{ needs.validate_height.outputs.forced_height }}
          PRECOMPUTED_BASE_URL: ${{ vars.PRECOMPUTED_BASE_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PIR_CONFIG_URL: ${{ vars.PIR_CONFIG_URL }}
          VOTING_CONFIG_URL: ${{ vars.VOTING_CONFIG_URL }}
          LWD_URLS: ${{ vars.LWD_URLS }}

  notify-slack:
    name: Slack Notification
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs: [validate_height, restart_backup_beta, restart_backup, restart_primary_beta, restart_primary]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PIR Fleet Restart failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "PIR Fleet Restart Failed" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Restart PIR fleet>" },
                    { "type": "mrkdwn", "text": "*Targets:*\n`${{ inputs.targets }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nBackup beta: `${{ needs.restart_backup_beta.result }}` | Backup: `${{ needs.restart_backup.result }}` | Primary beta: `${{ needs.restart_primary_beta.result }}` | Primary: `${{ needs.restart_primary.result }}`" }
                }
              ]
            }
