# Build nf-server for all platforms and publish a GitHub Release on version tags.
#
# Release assets:
#   nf-server-linux-amd64, nf-server-linux-arm64,
#   nf-server-darwin-amd64, nf-server-darwin-arm64,
#   nullifier-query-server.service, SHA256SUMS
# DO Spaces: tag-scoped start/update scripts and SHA256SUMS-<tag>.
# Stable tags also update the latest and snapshot-height installer aliases.
#   (same contents as GitHub Releases SHA256SUMS)
#
# The zally (Shielded-Vote) release workflow fetches these binaries via
# `gh release download` when assembling its own release tarballs.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-metadata:
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
      make_latest: ${{ steps.channel.outputs.make_latest }}
      publish_mutable_pointers: ${{ steps.channel.outputs.publish_mutable_pointers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify release tag
        id: channel
        env:
          RELEASE_HOLD_TAG: ${{ vars.RELEASE_HOLD_TAG }}
        run: |
          scripts/release-metadata.sh \
            "$GITHUB_REF_NAME" \
            "$RELEASE_HOLD_TAG" \
            >> "$GITHUB_OUTPUT"

  build:
    name: Build nf-server (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-latest
            platform: darwin-amd64
            cross: true
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.platform }}-nf-server-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-nf-server-

      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            # Cross-compile without serve feature: YPIR's C++ build uses
            # -march=native which fails when host and target arch differ.
            cargo build --release --manifest-path nf-server/Cargo.toml \
              --target ${{ matrix.rust_target }}
            mkdir -p target/release
            cp target/${{ matrix.rust_target }}/release/nf-server target/release/
          else
            if [ "${{ matrix.platform }}" = "linux-amd64" ]; then
              # Production fleet target: AVX-512 kernel + rayon parallelism.
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=x86-64-v4" \
                cargo build --release \
                --manifest-path nf-server/Cargo.toml --features avx512,rayon \
                --target x86_64-unknown-linux-gnu
              mkdir -p target/release
              cp target/x86_64-unknown-linux-gnu/release/nf-server target/release/
            else
              # linux-arm64 / darwin-arm64: no AVX-512, but rayon still
              # parallelises the kernel across cores.
              cargo build --release --manifest-path nf-server/Cargo.toml \
                --features serve,rayon
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nf-server-${{ matrix.platform }}
          path: target/release/nf-server

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-metadata, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nf-server-*

      - name: Prepare release assets
        run: |
          for PLATFORM in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "nf-server-${PLATFORM}/nf-server" "nf-server-${PLATFORM}.tmp"
            rm -rf "nf-server-${PLATFORM}"
            mv "nf-server-${PLATFORM}.tmp" "nf-server-${PLATFORM}"
            chmod +x "nf-server-${PLATFORM}"
          done
          cp docs/nullifier-query-server.service .

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum \
            nf-server-linux-amd64 \
            nf-server-linux-arm64 \
            nf-server-darwin-amd64 \
            nf-server-darwin-arm64 \
            nullifier-query-server.service \
            > SHA256SUMS

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          make_latest: ${{ needs.release-metadata.outputs.make_latest }}
          files: |
            nf-server-linux-amd64
            nf-server-linux-arm64
            nf-server-darwin-amd64
            nf-server-darwin-arm64
            nullifier-query-server.service
            SHA256SUMS

  distribute:
    name: Distribute to DigitalOcean Spaces
    runs-on: ubuntu-latest
    needs: [release, release-metadata]
    environment: staging
    env:
      DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
      DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
      DO_BUCKET: ${{ vars.DO_BUCKET || 'shielded-vote' }}
      DO_REGION: ${{ vars.DO_REGION || 'nyc3' }}
      DO_PUBLIC_BASE_URL: ${{ vars.DO_PUBLIC_BASE_URL }}
      DO_PRECOMPUTED_BASE_URL: ${{ vars.DO_PRECOMPUTED_BASE_URL }}
      PUBLISH_MUTABLE_POINTERS: ${{ needs.release-metadata.outputs.publish_mutable_pointers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nf-server-*

      - name: Prepare binaries and SHA256SUMS for Spaces
        run: |
          set -euo pipefail
          for PLATFORM in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "nf-server-${PLATFORM}/nf-server" "nf-server-${PLATFORM}.tmp"
            rm -rf "nf-server-${PLATFORM}"
            mv "nf-server-${PLATFORM}.tmp" "nf-server-${PLATFORM}"
            chmod +x "nf-server-${PLATFORM}"
          done
          cp docs/nullifier-query-server.service .
          sha256sum \
            nf-server-linux-amd64 \
            nf-server-linux-arm64 \
            nf-server-darwin-amd64 \
            nf-server-darwin-arm64 \
            nullifier-query-server.service \
            > SHA256SUMS

      - name: Render PIR helper scripts
        run: |
          set -euo pipefail
          if [ -z "$DO_BUCKET" ] || [ -z "$DO_REGION" ]; then
            echo "DO_BUCKET and DO_REGION must be non-empty." >&2
            exit 1
          fi
          PUBLIC_BASE_URL="${DO_PUBLIC_BASE_URL:-https://${DO_BUCKET}.${DO_REGION}.digitaloceanspaces.com}"
          PUBLIC_BASE_URL="${PUBLIC_BASE_URL%/}"
          PRECOMPUTED_BASE_URL="${DO_PRECOMPUTED_BASE_URL:-$PUBLIC_BASE_URL}"
          PRECOMPUTED_BASE_URL="${PRECOMPUTED_BASE_URL%/}"
          # Keep sed substitutions aligned with start-pir-installer-smoke.yml.
          sed \
            -e "s|__RELEASE_TAG__|${GITHUB_REF_NAME}|g" \
            -e "s|__GITHUB_REPO__|${GITHUB_REPOSITORY}|g" \
            -e "s|__BINARY_BASE_URL__|${PUBLIC_BASE_URL}/binaries/vote-pir|g" \
            -e "s|__PIR_CONFIG_URL__|https://voting.valargroup.org/prod/pir.json|g" \
            -e "s|__VOTING_CONFIG_URL__|https://voting.valargroup.org/prod/static-voting-config.json|g" \
            -e "s|__PRECOMPUTED_BASE_URL__|${PRECOMPUTED_BASE_URL}|g" \
            scripts/start_pir.sh.template > start_pir.sh
          chmod +x start_pir.sh
          sed \
            -e "s|__RELEASE_TAG__|${GITHUB_REF_NAME}|g" \
            -e "s|__GITHUB_REPO__|${GITHUB_REPOSITORY}|g" \
            -e "s|__BINARY_BASE_URL__|${PUBLIC_BASE_URL}/binaries/vote-pir|g" \
            scripts/update_pir.sh.template > update_pir.sh
          chmod +x update_pir.sh

      - name: Upload to DigitalOcean Spaces
        run: |
          set -euo pipefail
          if [ -z "$DO_ACCESS_KEY" ] || [ -z "$DO_SECRET_KEY" ]; then
            echo "DO_ACCESS_KEY and DO_SECRET_KEY are required to publish release artifacts to DigitalOcean Spaces." >&2
            exit 1
          fi
          if [ -z "$DO_BUCKET" ] || [ -z "$DO_REGION" ]; then
            echo "DO_BUCKET and DO_REGION must be non-empty." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME}"
          pip install --quiet s3cmd
          cat > /tmp/do-spaces.s3cfg <<EOF
          [default]
          access_key = ${DO_ACCESS_KEY}
          secret_key = ${DO_SECRET_KEY}
          host_base = ${DO_REGION}.digitaloceanspaces.com
          host_bucket = %(bucket)s.${DO_REGION}.digitaloceanspaces.com
          bucket_location = ${DO_REGION}
          use_https = True
          EOF
          for PLATFORM in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            BINARY="nf-server-${PLATFORM}"
            if [ -f "$BINARY" ]; then
              s3cmd -c /tmp/do-spaces.s3cfg put "$BINARY" \
                "s3://${DO_BUCKET}/binaries/vote-pir/nf-server-${VERSION}-${PLATFORM}" --acl-public --force
            fi
          done
          if [ -f SHA256SUMS ]; then
            s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force SHA256SUMS \
              "s3://${DO_BUCKET}/binaries/vote-pir/SHA256SUMS-${VERSION}"
          fi
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force start_pir.sh \
            "s3://${DO_BUCKET}/scripts/start_pir/${VERSION}/start_pir.sh"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force update_pir.sh \
            "s3://${DO_BUCKET}/scripts/update_pir/${VERSION}/update_pir.sh"

          if [ "$PUBLISH_MUTABLE_POINTERS" = "true" ]; then
            scripts/publish-release-pointers.sh \
              "$VERSION" \
              /tmp/do-spaces.s3cfg \
              start_pir.sh \
              update_pir.sh
          else
            echo "Leaving latest installer aliases unchanged for held or prerelease tag ${VERSION}."
          fi

  notify-slack:
    name: Slack Notification
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs: [build, release, distribute]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PIR Release failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "PIR Release Failed" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Release>" },
                    { "type": "mrkdwn", "text": "*Tag:*\n`${{ github.ref_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nBuild: `${{ needs.build.result }}` | Release: `${{ needs.release.result }}` | Distribute: `${{ needs.distribute.result }}`" }
                }
              ]
            }
