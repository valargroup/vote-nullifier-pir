name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Held stable release tag to promote (vN.N.N)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_HOLD_TAG: ${{ vars.RELEASE_HOLD_TAG }}
      DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
      DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
      DO_BUCKET: ${{ vars.DO_BUCKET || 'shielded-vote' }}
      DO_REGION: ${{ vars.DO_REGION || 'nyc3' }}
      DO_PUBLIC_BASE_URL: ${{ vars.DO_PUBLIC_BASE_URL }}
      PIR_CONFIG_URL: https://voting.valargroup.org/prod/pir.json
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out held release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate held stable release
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          scripts/validate-release-promotion.sh \
            "$RELEASE_TAG" \
            "$RELEASE_HOLD_TAG" \
            "$latest_tag"
          [ "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)" ]

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [ "$(jq -r '.draft' <<<"$release_json")" = "false" ]
          [ "$(jq -r '.prerelease' <<<"$release_json")" = "false" ]

      - name: Verify tag-scoped release artifacts
        run: |
          set -euo pipefail
          public_base_url="${DO_PUBLIC_BASE_URL:-https://${DO_BUCKET}.${DO_REGION}.digitaloceanspaces.com}"
          public_base_url="${public_base_url%/}"

          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            curl -fsSIL --retry 3 --retry-delay 2 \
              "${public_base_url}/binaries/vote-pir/nf-server-${RELEASE_TAG}-${platform}" \
              >/dev/null
          done
          curl -fsSIL --retry 3 --retry-delay 2 \
            "${public_base_url}/binaries/vote-pir/SHA256SUMS-${RELEASE_TAG}" \
            >/dev/null
          curl -fsSIL --retry 3 --retry-delay 2 \
            "${public_base_url}/scripts/start_pir/${RELEASE_TAG}/start_pir.sh" \
            >/dev/null
          curl -fsSIL --retry 3 --retry-delay 2 \
            "${public_base_url}/scripts/update_pir/${RELEASE_TAG}/update_pir.sh" \
            >/dev/null

      - name: Publish mutable release pointers
        run: |
          set -euo pipefail
          public_base_url="${DO_PUBLIC_BASE_URL:-https://${DO_BUCKET}.${DO_REGION}.digitaloceanspaces.com}"
          public_base_url="${public_base_url%/}"

          curl -fsSL --retry 3 --retry-delay 2 \
            "${public_base_url}/scripts/start_pir/${RELEASE_TAG}/start_pir.sh" \
            -o /tmp/start_pir.sh
          curl -fsSL --retry 3 --retry-delay 2 \
            "${public_base_url}/scripts/update_pir/${RELEASE_TAG}/update_pir.sh" \
            -o /tmp/update_pir.sh

          pip install --quiet s3cmd
          cat > /tmp/do-spaces.s3cfg <<EOF
          [default]
          access_key = ${DO_ACCESS_KEY}
          secret_key = ${DO_SECRET_KEY}
          host_base = ${DO_REGION}.digitaloceanspaces.com
          host_bucket = %(bucket)s.${DO_REGION}.digitaloceanspaces.com
          bucket_location = ${DO_REGION}
          use_https = True
          EOF

          scripts/publish-release-pointers.sh \
            "$RELEASE_TAG" \
            /tmp/do-spaces.s3cfg \
            /tmp/start_pir.sh \
            /tmp/update_pir.sh

      - name: Mark GitHub release latest
        run: gh release edit "$RELEASE_TAG" --latest --verify-tag

      - name: Verify promoted release channels
        run: |
          set -euo pipefail
          public_base_url="${DO_PUBLIC_BASE_URL:-https://${DO_BUCKET}.${DO_REGION}.digitaloceanspaces.com}"
          public_base_url="${public_base_url%/}"

          [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$RELEASE_TAG" ]
          curl -fsSL --retry 3 --retry-delay 2 "${public_base_url}/start_pir.sh" \
            | grep -Fq "readonly START_RELEASE_TAG='${RELEASE_TAG}'"
          curl -fsSL --retry 3 --retry-delay 2 "${public_base_url}/update_pir.sh" \
            | grep -Fq "readonly UPDATE_DEFAULT_RELEASE_TAG='${RELEASE_TAG}'"

          snapshot_height="$(curl -fsSL --retry 3 --retry-delay 2 "$PIR_CONFIG_URL" \
            | jq -er '.snapshot_height // empty')"
          case "$snapshot_height" in
            *[!0-9]*)
              echo "PIR config snapshot_height must be numeric, got: ${snapshot_height}" >&2
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 --retry-delay 2 \
            "${public_base_url}/scripts/start_pir/${snapshot_height}/start_pir.sh" \
            | grep -Fq "readonly START_RELEASE_TAG='${RELEASE_TAG}'"
