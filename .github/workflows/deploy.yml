# Deploy a tagged nf-server release to PIR hosts via SSH.
# Triggered automatically after a release build, or manually via workflow_dispatch.
# Requires environment secrets: PIR_PRIMARY_HOST, PIR_BACKUP_HOST, DEPLOY_USER, SSH_KEY, NF_SENTRY_DSN.
# See docs/runbooks/ci-setup.md for one-time remote setup.
#
# Ordering: when targets=both, backup is deployed and readiness-checked first,
# then primary. Matches restart.yml so release automation does not restart
# primary while backup still runs an old binary or fails readiness.

name: Deploy nf-server

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (e.g. v0.3.0)"
        required: true
        type: string
      target_environment:
        description: "GitHub Environment to read deploy secrets from"
        required: true
        type: choice
        options:
          - staging
          - production
        default: production
      height:
        description: "Optional published snapshot height to force after deploy"
        required: false
        type: string
        default: ""
      targets:
        description: "Which hosts to deploy to"
        required: true
        type: choice
        options:
          - both
          - primary
          - backup
        default: both
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target_environment:
        required: false
        type: string
        default: production
      height:
        required: false
        type: string
        default: ""
      targets:
        required: false
        type: string
        default: both

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/nf-ingest

jobs:
  validate_height:
    name: Validate forced snapshot height
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    outputs:
      forced_height: ${{ steps.validate.outputs.forced_height }}
    env:
      SNAPSHOTS_BASE_URL: ${{ vars.SNAPSHOTS_BASE_URL }}
    steps:
      - name: Validate optional height
        id: validate
        env:
          REQUESTED_HEIGHT: ${{ inputs.height }}
        run: |
          set -euo pipefail
          HEIGHT="$REQUESTED_HEIGHT"
          HEIGHT="$(printf '%s' "$HEIGHT" | tr -d '[:space:]')"

          if [ -z "$HEIGHT" ]; then
            echo "forced_height=" >> "$GITHUB_OUTPUT"
            echo "No forced snapshot height requested."
            exit 0
          fi
          if [ -z "$SNAPSHOTS_BASE_URL" ]; then
            echo "SNAPSHOTS_BASE_URL environment variable is required for forced-height validation." >&2
            exit 1
          fi

          case "$HEIGHT" in
            *[!0-9]*)
              echo "height must be numeric, got: $HEIGHT" >&2
              exit 1
              ;;
          esac
          if [ $((HEIGHT % 10)) -ne 0 ]; then
            echo "height must be a multiple of 10, got: $HEIGHT" >&2
            exit 1
          fi

          MANIFEST_URL="$SNAPSHOTS_BASE_URL/$HEIGHT/manifest.json"
          echo "==> Fetching $MANIFEST_URL"
          curl -fsSL --retry 3 "$MANIFEST_URL" -o manifest.json

          if ! jq -e \
            '.schema_version == 2 and .nullifier_pool == "ironwood" and .dataset_version == 1' \
            manifest.json >/dev/null; then
            echo "manifest is not Ironwood dataset version 1 with schema version 2" >&2
            exit 1
          fi

          MANIFEST_HEIGHT="$(jq -r '.height // empty' manifest.json)"
          if [ "$MANIFEST_HEIGHT" != "$HEIGHT" ]; then
            echo "manifest height ($MANIFEST_HEIGHT) does not match requested height ($HEIGHT)" >&2
            exit 1
          fi

          for f in tier0.bin tier1.bin tier2.bin pir_root.json; do
            if ! jq -e --arg f "$f" '.files[$f].sha256 and .files[$f].size' manifest.json >/dev/null; then
              echo "manifest is missing required file entry: $f" >&2
              exit 1
            fi
            curl -fsSI --retry 3 "$SNAPSHOTS_BASE_URL/$HEIGHT/$f" >/dev/null
          done

          echo "forced_height=$HEIGHT" >> "$GITHUB_OUTPUT"
          echo "Snapshot $HEIGHT is published and has all required tier files."

  deploy_backup:
    name: Deploy ${{ inputs.release_tag }} to backup
    needs: validate_height
    if: inputs.targets == 'both' || inputs.targets == 'backup'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout (for service file)
        uses: actions/checkout@v4

      - name: Stage deploy artifacts
        run: |
          set -euo pipefail
          cp docs/nullifier-query-server.service .
          rm -rf nf-server/
          curl -fL --retry 5 -o nf-server \
            "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/nf-server-linux-amd64"
          chmod +x nf-server
          DATASET_INFO=$(./nf-server dataset-info)
          printf '%s\n' "$DATASET_INFO" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"'
          printf '%s\n' "$DATASET_INFO" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*1[[:space:]]*([,}])'

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PIR_BACKUP_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "nf-server,nullifier-query-server.service"
          target: ${{ env.DEPLOY_PATH }}

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PIR_BACKUP_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_RELEASE,FORCED_HEIGHT,PRECOMPUTED_BASE_URL,TARGET_ENVIRONMENT,PIR_CONFIG_URL,VOTING_CONFIG_URL
          script: |
            set -eu
            DATASET_INFO=$(sudo /opt/nf-ingest/nf-server dataset-info)
            if ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*1[[:space:]]*([,}])'; then
              echo "FAIL: staged nf-server does not support Ironwood dataset version 1."
              exit 1
            fi
            DROPIN_DIR=/etc/systemd/system/nullifier-query-server.service.d
            DROPIN_FILE="$DROPIN_DIR/force-snapshot.conf"

            tmp=$(mktemp)
            {
              echo "SENTRY_DSN=$SENTRY_DSN"
              echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
              echo "SENTRY_RELEASE=$SENTRY_RELEASE"
            } > "$tmp"
            sudo install -m 0600 -o root -g root "$tmp" /opt/nf-ingest/.env
            rm -f "$tmp"
            sudo chmod +x /opt/nf-ingest/nf-server
            sudo cp /opt/nf-ingest/nullifier-query-server.service /etc/systemd/system/nullifier-query-server.service
            DEFAULTS_FILE=/etc/default/nf-server
            case "$TARGET_ENVIRONMENT" in
              production) PIR_ENV=prod ;;
              staging) PIR_ENV=stage ;;
              *)
                echo "Unsupported target_environment: $TARGET_ENVIRONMENT" >&2
                exit 1
                ;;
            esac
            PIR_CONFIG_URL="${PIR_CONFIG_URL:-https://voting.valargroup.org/${PIR_ENV}/pir.json}"
            VOTING_CONFIG_URL="${VOTING_CONFIG_URL:-https://voting.valargroup.org/${PIR_ENV}/static-voting-config.json}"
            PRECOMPUTED_BASE_URL="${PRECOMPUTED_BASE_URL:-https://shielded-vote.nyc3.digitaloceanspaces.com}"
            echo "==> Writing PIR defaults ($PIR_ENV)"
            tmp=$(mktemp)
            if sudo test -f "$DEFAULTS_FILE"; then
              sudo awk '!/^(SVOTE_PIR_CONFIG_URL|SVOTE_PIR_VOTING_CONFIG_URL|SVOTE_PIR_PRECOMPUTED_BASE_URL)=/' "$DEFAULTS_FILE" > "$tmp"
            fi
            {
              echo "SVOTE_PIR_CONFIG_URL=$PIR_CONFIG_URL"
              echo "SVOTE_PIR_VOTING_CONFIG_URL=$VOTING_CONFIG_URL"
              echo "SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL"
            } >> "$tmp"
            sudo install -m 0644 -o root -g root "$tmp" "$DEFAULTS_FILE"
            rm -f "$tmp"
            if [ -n "$FORCED_HEIGHT" ]; then
              if [ -z "$PRECOMPUTED_BASE_URL" ]; then
                echo "PRECOMPUTED_BASE_URL is required when forcing a snapshot height." >&2
                exit 1
              fi
              echo "==> Forcing snapshot bootstrap height $FORCED_HEIGHT from $PRECOMPUTED_BASE_URL"
              sudo install -d -m 0755 "$DROPIN_DIR"
              tmp=$(mktemp)
              cat > "$tmp" <<EOF
            [Service]
            Environment=SVOTE_PIR_FORCE_SNAPSHOT_HEIGHT=$FORCED_HEIGHT
            Environment=SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL
            EOF
              sudo install -m 0644 -o root -g root "$tmp" "$DROPIN_FILE"
              rm -f "$tmp"
            elif sudo test -f "$DROPIN_FILE"; then
              echo "==> Removing stale forced snapshot drop-in"
              sudo rm -f "$DROPIN_FILE"
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable nullifier-query-server
            sudo systemctl restart nullifier-query-server
            echo "Deployed ${{ inputs.release_tag }} to backup"
        env:
          SENTRY_DSN: ${{ secrets.NF_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
          SENTRY_RELEASE: ${{ inputs.release_tag }}
          FORCED_HEIGHT: ${{ needs.validate_height.outputs.forced_height }}
          PRECOMPUTED_BASE_URL: ${{ vars.PRECOMPUTED_BASE_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PIR_CONFIG_URL: ${{ vars.PIR_CONFIG_URL }}
          VOTING_CONFIG_URL: ${{ vars.VOTING_CONFIG_URL }}

      - name: Readiness check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PIR_BACKUP_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FORCED_HEIGHT
          # Cold-start budget: snapshot self-bootstrap (Phase 3, up to
          # ~30s for a same-region 6 GB CDN download from a DO Spaces
          # bucket) + load_serving_state which mmaps + parses ~6 GB of
          # tier files into memory (60-90s on the production droplets).
          # 10 minutes leaves extra headroom for cold hosts while still
          # failing deploys that never become query-ready.
          command_timeout: 11m
          script: |
            set -eu
            for i in $(seq 1 120); do
              if curl -sf http://localhost:3000/ready > /dev/null; then
                echo "Readiness check passed on backup (attempt $i)"
                break
              fi
              echo "Waiting for readiness... attempt $i/120"
              sleep 5
            done
            if ! curl -sf http://localhost:3000/ready > /dev/null; then
              echo "Readiness check FAILED on backup after 10m"
              sudo systemctl status nullifier-query-server --no-pager -l 2>/dev/null || true
              sudo journalctl -u nullifier-query-server --no-pager -n 50 2>/dev/null || \
                sudo grep -i nullifier /var/log/syslog 2>/dev/null | tail -30 || \
                echo "No logs available"
              exit 1
            fi

            ROOT=$(curl -sf --max-time 4 http://localhost:3000/root)
            if ! printf '%s\n' "$ROOT" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$ROOT" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*1[[:space:]]*([,}])'; then
              echo "FAIL: backup is not serving Ironwood dataset version 1."
              exit 1
            fi

            if [ -n "$FORCED_HEIGHT" ]; then
              METRICS=$(curl -sf --max-time 4 http://localhost:3000/metrics)
              metric_value() {
                printf '%s\n' "$METRICS" | awk -v name="$1" '$1==name {print int($2); found=1; exit} END {if (!found) exit 1}'
              }
              if ! SERVED=$(metric_value nf_snapshot_served_height); then
                echo "FAIL: nf_snapshot_served_height metric is missing."
                exit 1
              fi
              echo "==> Snapshot height: served=$SERVED forced=$FORCED_HEIGHT"
              echo "==> Bootstrap outcomes:"
              printf '%s\n' "$METRICS" | awk '$1 ~ /^nf_snapshot_bootstrap_outcomes_total/ {print "  " $0}' || true
              if [ "$SERVED" -ne "$FORCED_HEIGHT" ]; then
                echo "FAIL: served ($SERVED) != forced height ($FORCED_HEIGHT)."
                echo "Hint: ensure snapshots/${FORCED_HEIGHT}/ is published to Spaces and inspect bootstrap outcomes above."
                exit 1
              fi
              echo "OK: backup is serving forced snapshot height $SERVED"
              echo "==> Removing forced snapshot drop-in after successful deploy"
              sudo rm -f /etc/systemd/system/nullifier-query-server.service.d/force-snapshot.conf
              sudo systemctl daemon-reload
            fi
        env:
          FORCED_HEIGHT: ${{ needs.validate_height.outputs.forced_height }}

  deploy_primary:
    name: Deploy ${{ inputs.release_tag }} to primary
    needs: [validate_height, deploy_backup]
    if: |
      always() &&
      (inputs.targets == 'both' || inputs.targets == 'primary') &&
      needs.validate_height.result == 'success' &&
      (needs.deploy_backup.result == 'success' || needs.deploy_backup.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout (for service file)
        uses: actions/checkout@v4

      - name: Stage deploy artifacts
        run: |
          set -euo pipefail
          cp docs/nullifier-query-server.service .
          rm -rf nf-server/
          curl -fL --retry 5 -o nf-server \
            "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/nf-server-linux-amd64"
          chmod +x nf-server
          DATASET_INFO=$(./nf-server dataset-info)
          printf '%s\n' "$DATASET_INFO" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"'
          printf '%s\n' "$DATASET_INFO" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*1[[:space:]]*([,}])'

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PIR_PRIMARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "nf-server,nullifier-query-server.service"
          target: ${{ env.DEPLOY_PATH }}

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PIR_PRIMARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_RELEASE,FORCED_HEIGHT,PRECOMPUTED_BASE_URL,TARGET_ENVIRONMENT,PIR_CONFIG_URL,VOTING_CONFIG_URL
          script: |
            set -eu
            DATASET_INFO=$(sudo /opt/nf-ingest/nf-server dataset-info)
            if ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$DATASET_INFO" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*1[[:space:]]*([,}])'; then
              echo "FAIL: staged nf-server does not support Ironwood dataset version 1."
              exit 1
            fi
            DROPIN_DIR=/etc/systemd/system/nullifier-query-server.service.d
            DROPIN_FILE="$DROPIN_DIR/force-snapshot.conf"

            tmp=$(mktemp)
            {
              echo "SENTRY_DSN=$SENTRY_DSN"
              echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
              echo "SENTRY_RELEASE=$SENTRY_RELEASE"
            } > "$tmp"
            sudo install -m 0600 -o root -g root "$tmp" /opt/nf-ingest/.env
            rm -f "$tmp"
            sudo chmod +x /opt/nf-ingest/nf-server
            sudo cp /opt/nf-ingest/nullifier-query-server.service /etc/systemd/system/nullifier-query-server.service
            DEFAULTS_FILE=/etc/default/nf-server
            case "$TARGET_ENVIRONMENT" in
              production) PIR_ENV=prod ;;
              staging) PIR_ENV=stage ;;
              *)
                echo "Unsupported target_environment: $TARGET_ENVIRONMENT" >&2
                exit 1
                ;;
            esac
            PIR_CONFIG_URL="${PIR_CONFIG_URL:-https://voting.valargroup.org/${PIR_ENV}/pir.json}"
            VOTING_CONFIG_URL="${VOTING_CONFIG_URL:-https://voting.valargroup.org/${PIR_ENV}/static-voting-config.json}"
            PRECOMPUTED_BASE_URL="${PRECOMPUTED_BASE_URL:-https://shielded-vote.nyc3.digitaloceanspaces.com}"
            echo "==> Writing PIR defaults ($PIR_ENV)"
            tmp=$(mktemp)
            if sudo test -f "$DEFAULTS_FILE"; then
              sudo awk '!/^(SVOTE_PIR_CONFIG_URL|SVOTE_PIR_VOTING_CONFIG_URL|SVOTE_PIR_PRECOMPUTED_BASE_URL)=/' "$DEFAULTS_FILE" > "$tmp"
            fi
            {
              echo "SVOTE_PIR_CONFIG_URL=$PIR_CONFIG_URL"
              echo "SVOTE_PIR_VOTING_CONFIG_URL=$VOTING_CONFIG_URL"
              echo "SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL"
            } >> "$tmp"
            sudo install -m 0644 -o root -g root "$tmp" "$DEFAULTS_FILE"
            rm -f "$tmp"
            if [ -n "$FORCED_HEIGHT" ]; then
              if [ -z "$PRECOMPUTED_BASE_URL" ]; then
                echo "PRECOMPUTED_BASE_URL is required when forcing a snapshot height." >&2
                exit 1
              fi
              echo "==> Forcing snapshot bootstrap height $FORCED_HEIGHT from $PRECOMPUTED_BASE_URL"
              sudo install -d -m 0755 "$DROPIN_DIR"
              tmp=$(mktemp)
              cat > "$tmp" <<EOF
            [Service]
            Environment=SVOTE_PIR_FORCE_SNAPSHOT_HEIGHT=$FORCED_HEIGHT
            Environment=SVOTE_PIR_PRECOMPUTED_BASE_URL=$PRECOMPUTED_BASE_URL
            EOF
              sudo install -m 0644 -o root -g root "$tmp" "$DROPIN_FILE"
              rm -f "$tmp"
            elif sudo test -f "$DROPIN_FILE"; then
              echo "==> Removing stale forced snapshot drop-in"
              sudo rm -f "$DROPIN_FILE"
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable nullifier-query-server
            sudo systemctl restart nullifier-query-server
            echo "Deployed ${{ inputs.release_tag }} to primary"
        env:
          SENTRY_DSN: ${{ secrets.NF_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
          SENTRY_RELEASE: ${{ inputs.release_tag }}
          FORCED_HEIGHT: ${{ needs.validate_height.outputs.forced_height }}
          PRECOMPUTED_BASE_URL: ${{ vars.PRECOMPUTED_BASE_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PIR_CONFIG_URL: ${{ vars.PIR_CONFIG_URL }}
          VOTING_CONFIG_URL: ${{ vars.VOTING_CONFIG_URL }}

      - name: Readiness check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PIR_PRIMARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FORCED_HEIGHT
          command_timeout: 11m
          script: |
            set -eu
            for i in $(seq 1 120); do
              if curl -sf http://localhost:3000/ready > /dev/null; then
                echo "Readiness check passed on primary (attempt $i)"
                break
              fi
              echo "Waiting for readiness... attempt $i/120"
              sleep 5
            done
            if ! curl -sf http://localhost:3000/ready > /dev/null; then
              echo "Readiness check FAILED on primary after 10m"
              sudo systemctl status nullifier-query-server --no-pager -l 2>/dev/null || true
              sudo journalctl -u nullifier-query-server --no-pager -n 50 2>/dev/null || \
                sudo grep -i nullifier /var/log/syslog 2>/dev/null | tail -30 || \
                echo "No logs available"
              exit 1
            fi

            ROOT=$(curl -sf --max-time 4 http://localhost:3000/root)
            if ! printf '%s\n' "$ROOT" | grep -Eq '"nullifier_pool"[[:space:]]*:[[:space:]]*"ironwood"' || \
               ! printf '%s\n' "$ROOT" | grep -Eq '"dataset_version"[[:space:]]*:[[:space:]]*1[[:space:]]*([,}])'; then
              echo "FAIL: primary is not serving Ironwood dataset version 1."
              exit 1
            fi

            if [ -n "$FORCED_HEIGHT" ]; then
              METRICS=$(curl -sf --max-time 4 http://localhost:3000/metrics)
              metric_value() {
                printf '%s\n' "$METRICS" | awk -v name="$1" '$1==name {print int($2); found=1; exit} END {if (!found) exit 1}'
              }
              if ! SERVED=$(metric_value nf_snapshot_served_height); then
                echo "FAIL: nf_snapshot_served_height metric is missing."
                exit 1
              fi
              echo "==> Snapshot height: served=$SERVED forced=$FORCED_HEIGHT"
              echo "==> Bootstrap outcomes:"
              printf '%s\n' "$METRICS" | awk '$1 ~ /^nf_snapshot_bootstrap_outcomes_total/ {print "  " $0}' || true
              if [ "$SERVED" -ne "$FORCED_HEIGHT" ]; then
                echo "FAIL: served ($SERVED) != forced height ($FORCED_HEIGHT)."
                echo "Hint: ensure snapshots/${FORCED_HEIGHT}/ is published to Spaces and inspect bootstrap outcomes above."
                exit 1
              fi
              echo "OK: primary is serving forced snapshot height $SERVED"
              echo "==> Removing forced snapshot drop-in after successful deploy"
              sudo rm -f /etc/systemd/system/nullifier-query-server.service.d/force-snapshot.conf
              sudo systemctl daemon-reload
            fi
        env:
          FORCED_HEIGHT: ${{ needs.validate_height.outputs.forced_height }}

  notify-slack:
    name: Slack Notification
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs: [validate_height, deploy_backup, deploy_primary]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PIR Deploy failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "PIR Deploy Failed" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Deploy nf-server>" },
                    { "type": "mrkdwn", "text": "*Tag:*\n`${{ inputs.release_tag }}`" },
                    { "type": "mrkdwn", "text": "*Targets:*\n`${{ inputs.targets }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nBackup: `${{ needs.deploy_backup.result }}` | Primary: `${{ needs.deploy_primary.result }}`" }
                }
              ]
            }

  record-sentry-deploy:
    name: Record Sentry deploy
    if: |
      always() &&
      needs.validate_height.result == 'success' &&
      (needs.deploy_backup.result == 'success' || needs.deploy_backup.result == 'skipped') &&
      (needs.deploy_primary.result == 'success' || needs.deploy_primary.result == 'skipped')
    needs: [validate_height, deploy_backup, deploy_primary]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
    steps:
      - name: Record deploy marker
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN is not configured; skipping Sentry deploy marker."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new --org valar-group --project nf-server "${{ inputs.release_tag }}" || true
          sentry-cli deploys new \
            --org valar-group \
            --project nf-server \
            --release "${{ inputs.release_tag }}" \
            -e "${SENTRY_ENVIRONMENT}"
