# Deploy a tagged nf-server release to PIR hosts via SSH.
# Triggered automatically after a release build, or manually via workflow_dispatch.
# Requires environment secrets: PIR_PRIMARY_HOST, PIR_BACKUP_HOST,
# PIR_PRIMARY_BETA_HOST, PIR_BACKUP_BETA_HOST, DEPLOY_USER, SSH_KEY,
# NF_SENTRY_DSN.
# See docs/runbooks/ci-setup.md for one-time remote setup.
#
# Ordering: when targets=both, backup-beta, backup, primary-beta, then primary.

name: Deploy nf-server

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (e.g. v0.3.0)"
        required: true
        type: string
      target_environment:
        description: "GitHub Environment to read deploy secrets from"
        required: true
        type: choice
        options:
          - staging
          - production
        default: production
      height:
        description: "Optional published snapshot height to force after deploy"
        required: false
        type: string
        default: ""
      targets:
        description: "Which hosts to deploy to"
        required: true
        type: choice
        options:
          - both
          - primary
          - backup
          - primary-beta
          - backup-beta
        default: both
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target_environment:
        required: false
        type: string
        default: production
      height:
        required: false
        type: string
        default: ""
      targets:
        required: false
        type: string
        default: both

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/nf-ingest
  SVOTE_ZCASH_NETWORK: ${{ inputs.target_environment == 'staging' && 'test' || 'main' }}

jobs:
  validate_height:
    name: Validate deploy inputs
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    outputs:
      forced_height: ${{ steps.validate.outputs.forced_height }}
    env:
      SNAPSHOTS_BASE_URL: ${{ vars.SNAPSHOTS_BASE_URL }}
    steps:
      - name: Validate inputs
        id: validate
        env:
          REQUESTED_HEIGHT: ${{ inputs.height }}
          LWD_URLS: ${{ vars.LWD_URLS }}
          TARGETS: ${{ inputs.targets }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" != production ] && [[ "$TARGETS" == *-beta ]]; then
            echo "Beta PIR targets exist only in production." >&2
            exit 1
          fi
          if [ -z "${LWD_URLS//[[:space:],]/}" ]; then
            echo "LWD_URLS must name at least one lightwalletd endpoint." >&2
            exit 1
          fi
          HEIGHT="$REQUESTED_HEIGHT"
          HEIGHT="$(printf '%s' "$HEIGHT" | tr -d '[:space:]')"

          if [ -z "$HEIGHT" ]; then
            echo "forced_height=" >> "$GITHUB_OUTPUT"
            echo "No forced snapshot height requested."
            exit 0
          fi
          if [ -z "$SNAPSHOTS_BASE_URL" ]; then
            echo "SNAPSHOTS_BASE_URL environment variable is required for forced-height validation." >&2
            exit 1
          fi

          case "$HEIGHT" in
            *[!0-9]*)
              echo "height must be numeric, got: $HEIGHT" >&2
              exit 1
              ;;
          esac
          if [ $((HEIGHT % 10)) -ne 0 ]; then
            echo "height must be a multiple of 10, got: $HEIGHT" >&2
            exit 1
          fi

          MANIFEST_URL="$SNAPSHOTS_BASE_URL/$SVOTE_ZCASH_NETWORK/$HEIGHT/manifest.json"
          echo "==> Fetching $MANIFEST_URL"
          curl -fsSL --retry 3 "$MANIFEST_URL" -o manifest.json

          if ! jq -e \
            '.schema_version == 2 and .nullifier_pool == "ironwood" and .dataset_version == 2' \
            manifest.json >/dev/null; then
            echo "manifest has the wrong schema or dataset identity" >&2
            exit 1
          fi

          MANIFEST_HEIGHT="$(jq -r '.height // empty' manifest.json)"
          if [ "$MANIFEST_HEIGHT" != "$HEIGHT" ]; then
            echo "manifest height ($MANIFEST_HEIGHT) does not match requested height ($HEIGHT)" >&2
            exit 1
          fi

          for f in tier0.bin tier1.bin pir_root.json; do
            if ! jq -e --arg f "$f" '.files[$f].sha256 and .files[$f].size' manifest.json >/dev/null; then
              echo "manifest is missing required file entry: $f" >&2
              exit 1
            fi
            curl -fsSI --retry 3 "$SNAPSHOTS_BASE_URL/$SVOTE_ZCASH_NETWORK/$HEIGHT/$f" >/dev/null
          done

          curl -fsSL --retry 3 "$SNAPSHOTS_BASE_URL/$SVOTE_ZCASH_NETWORK/$HEIGHT/pir_root.json" -o pir_root.json
          if ! jq -e --arg network "$SVOTE_ZCASH_NETWORK" '.zcash_network == $network' pir_root.json >/dev/null; then
            echo "pir_root.json is not for Zcash network $SVOTE_ZCASH_NETWORK" >&2
            exit 1
          fi

          echo "forced_height=$HEIGHT" >> "$GITHUB_OUTPUT"
          echo "$SVOTE_ZCASH_NETWORK snapshot $HEIGHT is published and has all required tier files."

  deploy_backup_beta:
    name: Deploy ${{ inputs.release_tag }} to backup-beta
    needs: validate_height
    if: inputs.target_environment == 'production' && (inputs.targets == 'both' || inputs.targets == 'backup-beta')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-pir-host
        with:
          host: ${{ secrets.PIR_BACKUP_BETA_HOST }}
          host_role: backup-beta
          deploy_user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          release_tag: ${{ inputs.release_tag }}
          target_environment: ${{ inputs.target_environment }}
          forced_height: ${{ needs.validate_height.outputs.forced_height }}
          sentry_dsn: ${{ secrets.NF_SENTRY_DSN }}
          precomputed_base_url: ${{ vars.PRECOMPUTED_BASE_URL }}
          pir_config_url: ${{ vars.PIR_CONFIG_URL }}
          voting_config_url: ${{ vars.VOTING_CONFIG_URL }}
          lwd_urls: ${{ vars.LWD_URLS }}
          pir_apm_slack_webhook_url: ${{ secrets.PIR_APM_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

  deploy_backup:
    name: Deploy ${{ inputs.release_tag }} to backup
    needs: [validate_height, deploy_backup_beta]
    if: |
      always() &&
      (inputs.targets == 'both' || inputs.targets == 'backup') &&
      needs.validate_height.result == 'success' &&
      (needs.deploy_backup_beta.result == 'success' || needs.deploy_backup_beta.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-pir-host
        with:
          host: ${{ secrets.PIR_BACKUP_HOST }}
          host_role: backup
          deploy_user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          release_tag: ${{ inputs.release_tag }}
          target_environment: ${{ inputs.target_environment }}
          forced_height: ${{ needs.validate_height.outputs.forced_height }}
          sentry_dsn: ${{ secrets.NF_SENTRY_DSN }}
          precomputed_base_url: ${{ vars.PRECOMPUTED_BASE_URL }}
          pir_config_url: ${{ vars.PIR_CONFIG_URL }}
          voting_config_url: ${{ vars.VOTING_CONFIG_URL }}
          lwd_urls: ${{ vars.LWD_URLS }}
          pir_apm_slack_webhook_url: ${{ secrets.PIR_APM_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

  deploy_primary_beta:
    name: Deploy ${{ inputs.release_tag }} to primary-beta
    needs: [validate_height, deploy_backup]
    if: |
      always() &&
      inputs.target_environment == 'production' &&
      (inputs.targets == 'both' || inputs.targets == 'primary-beta') &&
      needs.validate_height.result == 'success' &&
      (needs.deploy_backup.result == 'success' || needs.deploy_backup.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-pir-host
        with:
          host: ${{ secrets.PIR_PRIMARY_BETA_HOST }}
          host_role: primary-beta
          deploy_user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          release_tag: ${{ inputs.release_tag }}
          target_environment: ${{ inputs.target_environment }}
          forced_height: ${{ needs.validate_height.outputs.forced_height }}
          sentry_dsn: ${{ secrets.NF_SENTRY_DSN }}
          precomputed_base_url: ${{ vars.PRECOMPUTED_BASE_URL }}
          pir_config_url: ${{ vars.PIR_CONFIG_URL }}
          voting_config_url: ${{ vars.VOTING_CONFIG_URL }}
          lwd_urls: ${{ vars.LWD_URLS }}
          pir_apm_slack_webhook_url: ${{ secrets.PIR_APM_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

  deploy_primary:
    name: Deploy ${{ inputs.release_tag }} to primary
    needs: [validate_height, deploy_primary_beta]
    if: |
      always() &&
      (inputs.targets == 'both' || inputs.targets == 'primary') &&
      needs.validate_height.result == 'success' &&
      (needs.deploy_primary_beta.result == 'success' || needs.deploy_primary_beta.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-pir-host
        with:
          host: ${{ secrets.PIR_PRIMARY_HOST }}
          host_role: primary
          deploy_user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          release_tag: ${{ inputs.release_tag }}
          target_environment: ${{ inputs.target_environment }}
          forced_height: ${{ needs.validate_height.outputs.forced_height }}
          sentry_dsn: ${{ secrets.NF_SENTRY_DSN }}
          precomputed_base_url: ${{ vars.PRECOMPUTED_BASE_URL }}
          pir_config_url: ${{ vars.PIR_CONFIG_URL }}
          voting_config_url: ${{ vars.VOTING_CONFIG_URL }}
          lwd_urls: ${{ vars.LWD_URLS }}
          pir_apm_slack_webhook_url: ${{ secrets.PIR_APM_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

  notify-slack:
    name: Slack Notification
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs: [validate_height, deploy_backup_beta, deploy_backup, deploy_primary_beta, deploy_primary]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PIR Deploy failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "PIR Deploy Failed" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Deploy nf-server>" },
                    { "type": "mrkdwn", "text": "*Tag:*\n`${{ inputs.release_tag }}`" },
                    { "type": "mrkdwn", "text": "*Targets:*\n`${{ inputs.targets }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nBackup beta: `${{ needs.deploy_backup_beta.result }}` | Backup: `${{ needs.deploy_backup.result }}` | Primary beta: `${{ needs.deploy_primary_beta.result }}` | Primary: `${{ needs.deploy_primary.result }}`" }
                }
              ]
            }

  record-sentry-deploy:
    name: Record Sentry deploy
    if: |
      always() &&
      needs.validate_height.result == 'success' &&
      (needs.deploy_backup_beta.result == 'success' || needs.deploy_backup_beta.result == 'skipped') &&
      (needs.deploy_backup.result == 'success' || needs.deploy_backup.result == 'skipped') &&
      (needs.deploy_primary_beta.result == 'success' || needs.deploy_primary_beta.result == 'skipped') &&
      (needs.deploy_primary.result == 'success' || needs.deploy_primary.result == 'skipped')
    needs: [validate_height, deploy_backup_beta, deploy_backup, deploy_primary_beta, deploy_primary]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
    steps:
      - name: Record deploy marker
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN is not configured; skipping Sentry deploy marker."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new --org valar-group --project nf-server "${{ inputs.release_tag }}" || true
          sentry-cli deploys new \
            --org valar-group \
            --project nf-server \
            --release "${{ inputs.release_tag }}" \
            -e "${SENTRY_ENVIRONMENT}"
