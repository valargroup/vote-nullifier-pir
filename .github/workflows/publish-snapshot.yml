# Build a PIR snapshot at a given block height and publish it to DO Spaces
# under s3://${DO_BUCKET}/snapshots/<network>/<height>/ for download by replicas
# and the admin UI. Runs on the canonical snapshot publisher host.
#
# Syncs the canonical publisher data, writes tier blobs under /tmp, and never
# restarts the service. The reset input is only for one-time dataset migrations.
#
# Requires repository or environment secrets:
#   PIR_SNAPSHOT_PUBLISHER_HOST, DEPLOY_USER, SSH_KEY,
#   DO_ACCESS_KEY, DO_SECRET_KEY.
# Requires an environment variable:
#   LWD_URLS (testnet endpoints in staging, mainnet endpoints in production).

name: Publish nullifier snapshot

on:
  workflow_dispatch:
    inputs:
      height:
        description: "Target block height (rounded down to nearest multiple of 10). If empty, uses the latest chain tip."
        required: false
        type: string
      include_nullifier_artifacts:
        description: "If true, also upload raw artifacts under snapshots/<network>/<height>/ (large)."
        required: false
        type: boolean
        default: false
      reset_dataset:
        description: "One-time migration only: wipe the publisher dataset and rebuild it as Ironwood."
        required: false
        type: boolean
        default: false
      target_environment:
        description: "GitHub Environment to read publisher secrets and bucket variables from."
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/nf-ingest
  DO_BUCKET: ${{ vars.DO_BUCKET || 'shielded-vote' }}
  DO_REGION: ${{ vars.DO_REGION || 'nyc3' }}
  DO_PREFIX: snapshots
  DO_PUBLIC_BASE_URL: ${{ vars.DO_PUBLIC_BASE_URL }}

jobs:
  publish:
    name: Build and upload snapshot
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Round explicit height (if provided)
        id: round_height
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.height }}"
          if [ -n "$RAW" ]; then
            H=$(( (RAW / 10) * 10 ))
            echo "value=$H" >> "$GITHUB_OUTPUT"
            echo "Target height (explicit): $H"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "Target height: latest chain tip (resolved on publisher host)"
          fi

      - name: Build snapshot, upload to DO Spaces, verify
        uses: appleboy/ssh-action@v1.0.3
        env:
          DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          LWD_URLS: ${{ vars.LWD_URLS }}
          SVOTE_ZCASH_NETWORK: ${{ inputs.target_environment == 'staging' && 'test' || 'main' }}
        with:
          host: ${{ secrets.PIR_SNAPSHOT_PUBLISHER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DO_ACCESS_KEY,DO_SECRET_KEY,LWD_URLS,SVOTE_ZCASH_NETWORK
          command_timeout: 90m
          script: |
            set -euo pipefail

            REQUESTED_H="${{ steps.round_height.outputs.value }}"
            RESET_DATASET="${{ inputs.reset_dataset }}"
            STAGE="/tmp/snap-build-${SVOTE_ZCASH_NETWORK}-$$"
            BUCKET="${{ env.DO_BUCKET }}"
            REGION="${{ env.DO_REGION }}"
            PREFIX="${{ env.DO_PREFIX }}"
            PUBLIC_BASE_URL="${{ env.DO_PUBLIC_BASE_URL }}"
            LWD_URLS="${LWD_URLS:-}"
            if [ -z "${LWD_URLS//[[:space:],]/}" ]; then
              echo "LWD_URLS must name at least one $SVOTE_ZCASH_NETWORK lightwalletd endpoint." >&2
              exit 1
            fi
            if [ -z "$BUCKET" ] || [ -z "$REGION" ] || [ -z "$PREFIX" ]; then
              echo "DO_BUCKET, DO_REGION, and DO_PREFIX must be non-empty." >&2
              exit 1
            fi
            PREFIX="${PREFIX#/}"
            PREFIX="${PREFIX%/}"
            PREFIX="${PREFIX}/${SVOTE_ZCASH_NETWORK}"
            PUBLIC_BASE_URL="${PUBLIC_BASE_URL:-https://${BUCKET}.${REGION}.digitaloceanspaces.com}"
            PUBLIC_BASE_URL="${PUBLIC_BASE_URL%/}"
            SNAPSHOT_PUBLIC_BASE="${PUBLIC_BASE_URL}/${PREFIX}"

            echo "==> Ensuring s3cmd and jq are installed"
            if ! command -v s3cmd >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq s3cmd jq
            fi

            echo "==> Writing s3cmd config"
            S3CFG="$(mktemp)"
            trap 'rm -f "$S3CFG"; rm -rf "$STAGE"' EXIT
            cat > "$S3CFG" <<EOF
            [default]
            access_key = $DO_ACCESS_KEY
            secret_key = $DO_SECRET_KEY
            host_base = ${REGION}.digitaloceanspaces.com
            host_bucket = %(bucket)s.${REGION}.digitaloceanspaces.com
            bucket_location = ${REGION}
            use_https = True
            EOF

            echo "==> Sync $SVOTE_ZCASH_NETWORK nullifiers + tree checkpoint + PIR tiers"
            cd "${{ env.DEPLOY_PATH }}"
            export SVOTE_PIR_VOTING_CONFIG_URL=
            export SVOTE_PIR_DATA_DIR="${{ env.DEPLOY_PATH }}/pir-data/${SVOTE_ZCASH_NETWORK}"
            EXPECTED_NULLIFIER_POOL=ironwood
            EXPECTED_DATASET_VERSION=1
            if ! DATASET_INFO=$(./nf-server dataset-info 2>/dev/null) || ! jq -e \
              --arg pool "$EXPECTED_NULLIFIER_POOL" \
              --argjson version "$EXPECTED_DATASET_VERSION" \
              '.nullifier_pool == $pool and .dataset_version == $version' \
              <<<"$DATASET_INFO" >/dev/null; then
              echo "ERROR: installed nf-server is not Ironwood dataset version 1; refusing to sync or reset" >&2
              exit 1
            fi
            if [ "$RESET_DATASET" = "true" ]; then
              echo "    reset_dataset=true (wiping the publisher dataset before sync)"
              export SVOTE_PIR_SYNC_RESET=1
            else
              unset SVOTE_PIR_SYNC_RESET
            fi
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            if [ -n "$REQUESTED_H" ]; then
              echo "    up to explicit height $REQUESTED_H"
              ./nf-server sync \
                --output-dir "$STAGE" \
                --non-interactive \
                --invalidate-after-blocks \
                --max-height "$REQUESTED_H"
            else
              echo "    to latest chain tip"
              ./nf-server sync \
                --output-dir "$STAGE" \
                --non-interactive \
                --invalidate-after-blocks
            fi

            NF_DIR="$SVOTE_PIR_DATA_DIR"
            DATASET_MARKER="$NF_DIR/nullifiers.dataset.json"

            echo "==> Validate Ironwood dataset identity"
            if ! jq -e \
              --arg network "$SVOTE_ZCASH_NETWORK" \
              --arg pool "$EXPECTED_NULLIFIER_POOL" \
              --argjson version "$EXPECTED_DATASET_VERSION" \
              '.zcash_network == $network and .nullifier_pool == $pool and .dataset_version == $version' \
              "$STAGE/pir_root.json" >/dev/null; then
              echo "ERROR: pir_root.json is not the expected Ironwood dataset version" >&2
              exit 1
            fi
            if [ ! -f "$DATASET_MARKER" ] || ! jq -e \
              --arg network "$SVOTE_ZCASH_NETWORK" \
              --arg pool "$EXPECTED_NULLIFIER_POOL" \
              --argjson version "$EXPECTED_DATASET_VERSION" \
              '.zcash_network == $network and .nullifier_pool == $pool and .dataset_version == $version' \
              "$DATASET_MARKER" >/dev/null; then
              echo "ERROR: $DATASET_MARKER is missing or has the wrong dataset identity" >&2
              exit 1
            fi

            echo "==> Read height from exported pir_root.json"
            H=$(jq -r '.height // empty' "$STAGE/pir_root.json")
            if [ -z "$H" ]; then
              echo "ERROR: pir_root.json is missing the height field"
              exit 1
            fi
            echo "    Exported height: $H"

            if [ -n "$REQUESTED_H" ] && [ "$H" -gt "$REQUESTED_H" ]; then
              echo "ERROR: exported height ($H) exceeds requested ($REQUESTED_H)"
              exit 1
            fi

            echo "==> Building manifest.json"
            BIN_SHA=$(sha256sum "${{ env.DEPLOY_PATH }}/nf-server" | awk '{print $1}')
            CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            TIER_JSON=$(
              cd "$STAGE"
              for f in tier0.bin tier1.bin tier2.bin pir_root.json; do
                size=$(stat -c%s "$f")
                sha=$(sha256sum "$f" | awk '{print $1}')
                jq -n --arg name "$f" --argjson size "$size" --arg sha "$sha" \
                  '{($name): {size: $size, sha256: $sha}}'
              done | jq -s 'add'
            )
            NF_JSON='{}'
            if [ "${{ inputs.include_nullifier_artifacts }}" = "true" ]; then
              echo "    include_nullifier_artifacts=true (adding on-chain + tree blobs to manifest)"
              for f in nullifiers.bin nullifiers.checkpoint nullifiers.tree nullifiers.dataset.json; do
                if [ ! -f "$NF_DIR/$f" ]; then
                  echo "ERROR: missing $NF_DIR/$f — run sync on this host first or disable the flag"
                  exit 1
                fi
              done
              CHECKPOINT_SIZE=$(stat -c%s "$NF_DIR/nullifiers.checkpoint")
              CHECKPOINT_HEIGHT=$(od -An -t u8 -j 0 -N 8 "$NF_DIR/nullifiers.checkpoint" | tr -d ' ')
              CHECKPOINT_OFFSET=$(od -An -t u8 -j 8 -N 8 "$NF_DIR/nullifiers.checkpoint" | tr -d ' ')
              NULLIFIERS_SIZE=$(stat -c%s "$NF_DIR/nullifiers.bin")
              if [ "$CHECKPOINT_SIZE" != "16" ] || [ "$CHECKPOINT_HEIGHT" != "$H" ] || [ "$CHECKPOINT_OFFSET" != "$NULLIFIERS_SIZE" ]; then
                echo "ERROR: raw nullifier artifacts are not an exact checkpoint for exported height $H" >&2
                exit 1
              fi
              NF_JSON=$(
                for f in nullifiers.bin nullifiers.checkpoint nullifiers.tree nullifiers.dataset.json; do
                  size=$(stat -c%s "$NF_DIR/$f")
                  sha=$(sha256sum "$NF_DIR/$f" | awk '{print $1}')
                  jq -n --arg name "$f" --argjson size "$size" --arg sha "$sha" \
                    '{($name): {size: $size, sha256: $sha}}'
                done | jq -s 'add'
              )
            fi
            FILES_JSON=$(jq -n --argjson tier "$TIER_JSON" --argjson nf "$NF_JSON" '$tier + $nf')
            jq -n \
              --argjson height "$H" \
              --arg nullifier_pool "$EXPECTED_NULLIFIER_POOL" \
              --argjson dataset_version "$EXPECTED_DATASET_VERSION" \
              --arg created_at "$CREATED_AT" \
              --arg nf_server_sha256 "$BIN_SHA" \
              --arg git_ref "${{ github.ref_name }}" \
              --arg git_sha "${{ github.sha }}" \
              --argjson files "$FILES_JSON" \
              '{
                schema_version: 2,
                nullifier_pool: $nullifier_pool,
                dataset_version: $dataset_version,
                height: $height,
                created_at: $created_at,
                nf_server_sha256: $nf_server_sha256,
                publisher: { git_ref: $git_ref, git_sha: $git_sha },
                files: $files
              }' > "$STAGE/manifest.json"
            cat "$STAGE/manifest.json"

            echo "==> Upload data files to s3://$BUCKET/$PREFIX/$H/ (manifest last)"
            for f in tier0.bin tier1.bin tier2.bin pir_root.json; do
              echo "  - $f"
              s3cmd -c "$S3CFG" put "$STAGE/$f" "s3://$BUCKET/$PREFIX/$H/$f" \
                --acl-public --force --no-progress
            done
            if [ "${{ inputs.include_nullifier_artifacts }}" = "true" ]; then
              for f in nullifiers.bin nullifiers.checkpoint nullifiers.tree nullifiers.dataset.json; do
                echo "  - $f (nullifier / tree bundle)"
                s3cmd -c "$S3CFG" put "$NF_DIR/$f" "s3://$BUCKET/$PREFIX/$H/$f" \
                  --acl-public --force --no-progress
              done
            fi
            echo "  - manifest.json (last, so partial uploads stay invisible)"
            s3cmd -c "$S3CFG" put "$STAGE/manifest.json" "s3://$BUCKET/$PREFIX/$H/manifest.json" \
              --acl-public --force --no-progress \
              --add-header="Cache-Control:no-cache, max-age=0"

            echo "==> Enforce public-read ACL on all uploaded files"
            ACL_FILES="tier0.bin tier1.bin tier2.bin pir_root.json"
            if [ "${{ inputs.include_nullifier_artifacts }}" = "true" ]; then
              ACL_FILES="$ACL_FILES nullifiers.bin nullifiers.checkpoint nullifiers.tree nullifiers.dataset.json"
            fi
            for f in $ACL_FILES manifest.json; do
              s3cmd -c "$S3CFG" setacl --acl-public "s3://$BUCKET/$PREFIX/$H/$f"
            done

            echo "==> Verify published snapshot over HTTPS from $SNAPSHOT_PUBLIC_BASE"
            VERIFY_DIR=$(mktemp -d)
            trap 'rm -f "$S3CFG"; rm -rf "$STAGE" "$VERIFY_DIR"' EXIT
            curl -fsSL "$SNAPSHOT_PUBLIC_BASE/$H/manifest.json" -o "$VERIFY_DIR/manifest.json"
            REMOTE_HEIGHT=$(jq -r '.height' "$VERIFY_DIR/manifest.json")
            REMOTE_TIER0_SHA=$(jq -r '.files["tier0.bin"].sha256' "$VERIFY_DIR/manifest.json")
            REMOTE_ROOT_SHA=$(jq -r '.files["pir_root.json"].sha256 // empty' "$VERIFY_DIR/manifest.json")
            if ! jq -e \
              --arg pool "$EXPECTED_NULLIFIER_POOL" \
              --argjson version "$EXPECTED_DATASET_VERSION" \
              '.schema_version == 2 and .nullifier_pool == $pool and .dataset_version == $version' \
              "$VERIFY_DIR/manifest.json" >/dev/null; then
              echo "ERROR: remote manifest has the wrong schema or dataset identity"
              exit 1
            fi
            if [ "$REMOTE_HEIGHT" != "$H" ]; then
              echo "ERROR: remote manifest height ($REMOTE_HEIGHT) != $H"
              exit 1
            fi
            if [ -z "$REMOTE_ROOT_SHA" ]; then
              echo "ERROR: remote manifest is missing pir_root.json sha256"
              exit 1
            fi
            curl -fsSL "$SNAPSHOT_PUBLIC_BASE/$H/pir_root.json" -o "$VERIFY_DIR/pir_root.json"
            REMOTE_ROOT_HEIGHT=$(jq -r '.height // empty' "$VERIFY_DIR/pir_root.json")
            if ! jq -e \
              --arg network "$SVOTE_ZCASH_NETWORK" \
              --arg pool "$EXPECTED_NULLIFIER_POOL" \
              --argjson version "$EXPECTED_DATASET_VERSION" \
              '.zcash_network == $network and .nullifier_pool == $pool and .dataset_version == $version' \
              "$VERIFY_DIR/pir_root.json" >/dev/null; then
              echo "ERROR: remote pir_root.json has the wrong dataset identity"
              exit 1
            fi
            if [ "$REMOTE_ROOT_HEIGHT" != "$H" ]; then
              echo "ERROR: remote pir_root.json height ($REMOTE_ROOT_HEIGHT) != $H"
              exit 1
            fi
            ACTUAL_ROOT_SHA=$(sha256sum "$VERIFY_DIR/pir_root.json" | awk '{print $1}')
            if [ "$ACTUAL_ROOT_SHA" != "$REMOTE_ROOT_SHA" ]; then
              echo "ERROR: downloaded pir_root.json sha256 mismatch"
              echo "  expected: $REMOTE_ROOT_SHA"
              echo "  actual:   $ACTUAL_ROOT_SHA"
              exit 1
            fi
            curl -fsSL "$SNAPSHOT_PUBLIC_BASE/$H/tier0.bin" -o "$VERIFY_DIR/tier0.bin"
            ACTUAL_TIER0_SHA=$(sha256sum "$VERIFY_DIR/tier0.bin" | awk '{print $1}')
            if [ "$ACTUAL_TIER0_SHA" != "$REMOTE_TIER0_SHA" ]; then
              echo "ERROR: downloaded tier0.bin sha256 mismatch"
              echo "  expected: $REMOTE_TIER0_SHA"
              echo "  actual:   $ACTUAL_TIER0_SHA"
              exit 1
            fi
            if [ "${{ inputs.include_nullifier_artifacts }}" = "true" ]; then
              echo "==> Verify nullifier/tree entries: local disk matches published manifest (no multi-GB re-download)"
              curl -fsSL "$SNAPSHOT_PUBLIC_BASE/$H/nullifiers.dataset.json" -o "$VERIFY_DIR/nullifiers.dataset.json"
              if ! jq -e \
                --arg network "$SVOTE_ZCASH_NETWORK" \
                --arg pool "$EXPECTED_NULLIFIER_POOL" \
                --argjson version "$EXPECTED_DATASET_VERSION" \
                '.zcash_network == $network and .nullifier_pool == $pool and .dataset_version == $version' \
                "$VERIFY_DIR/nullifiers.dataset.json" >/dev/null; then
                echo "ERROR: remote nullifiers.dataset.json has the wrong dataset identity"
                exit 1
              fi
              EXPECTED_DATASET_SHA=$(jq -r '.files["nullifiers.dataset.json"].sha256 // empty' "$VERIFY_DIR/manifest.json")
              ACTUAL_DATASET_SHA=$(sha256sum "$VERIFY_DIR/nullifiers.dataset.json" | awk '{print $1}')
              if [ -z "$EXPECTED_DATASET_SHA" ] || [ "$ACTUAL_DATASET_SHA" != "$EXPECTED_DATASET_SHA" ]; then
                echo "ERROR: downloaded nullifiers.dataset.json sha256 mismatch"
                exit 1
              fi
              for f in nullifiers.bin nullifiers.checkpoint nullifiers.tree nullifiers.dataset.json; do
                EXPECT=$(jq -r --arg n "$f" '.files[$n].sha256 // empty' "$VERIFY_DIR/manifest.json")
                if [ -z "$EXPECT" ]; then
                  echo "ERROR: manifest missing files[$f] after upload"
                  exit 1
                fi
                ACTUAL=$(sha256sum "$NF_DIR/$f" | awk '{print $1}')
                if [ "$EXPECT" != "$ACTUAL" ]; then
                  echo "ERROR: local $f sha256 does not match manifest (upload integrity)"
                  echo "  manifest: $EXPECT"
                  echo "  local:    $ACTUAL"
                  exit 1
                fi
              done
            fi
            echo "==> $SVOTE_ZCASH_NETWORK snapshot $H published and verified at $SNAPSHOT_PUBLIC_BASE/$H/"
            case "${{ inputs.target_environment }}" in
              production) CONFIG_ENV=prod ;;
              staging) CONFIG_ENV=stage ;;
              *) CONFIG_ENV="${{ inputs.target_environment }}" ;;
            esac
            echo "Next step: update ${CONFIG_ENV}/pir.json to snapshot_height=$H, then restart the fleet."

  notify-slack:
    name: Slack Notification
    if: ${{ always() && needs.publish.result == 'failure' }}
    needs: [publish]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "PIR Snapshot Publish failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "PIR Snapshot Publish Failed" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Publish nullifier snapshot>" },
                    { "type": "mrkdwn", "text": "*Height:*\n`${{ github.event.inputs.height || 'latest' }}`" },
                    { "type": "mrkdwn", "text": "*Include nullifier artifacts:*\n`${{ inputs.include_nullifier_artifacts }}`" },
                    { "type": "mrkdwn", "text": "*Reset dataset:*\n`${{ inputs.reset_dataset }}`" }
                  ]
                }
              ]
            }
